<section class="mission-intro"><h1 data-en="The Sky Crane" data-zh="雲端吊塔"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="A treasure lift waits above the clouds. Help the tower keeper lift three chests with a gentle pull and awaken the Uplift Sigil." data-zh="寶藏升降台停在雲端。幫守塔人用較小的拉力吊起三個寶箱，喚醒升力符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="A brass treasure crane on an ancient tower above the clouds" data-zh="雲海上古老石塔的銅製寶藏吊機" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Choose a crane. Drag the gold rope handle DOWN, or use the slider. Stop the chest at the dashed landing mark, then record the lift." data-zh="選擇吊機。向下拖動金色拉繩把手，或使用滑桿。讓寶箱停在虛線平台，再記錄升降。"></p>
<div class="orbit-actions"><button id="fixed" type="button"></button><button id="moving" type="button"></button></div>
<div id="crane" role="img"></div><label for="pull" class="legend" data-en="Rope pulled · metres (m)" data-zh="拉出的繩長 · 米（m）"></label><input id="pull" type="range" min="0" max="6" step="0.5" value="0"><div class="orbit-actions" hidden><button id="less" data-en="− 0.5 m rope" data-zh="− 0.5 米繩"></button><button id="more" data-en="+ 0.5 m rope" data-zh="+ 0.5 米繩"></button></div>
<p class="legend" data-en="Ideal model: no friction; rope and pulleys have no weight. N means newtons, a unit of force. Drawing not to scale." data-zh="理想模型：沒有摩擦，繩和滑輪沒有重量。N 是牛頓，力的單位。圖畫不按比例。"></p>
<div class="hint-area"><button id="retry" data-en="Lower and try again" data-zh="放回起點再試"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div><ol id="evidence"></ol><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Record this lift ✦" data-zh="記錄這次升降 ✦"></button><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button>
<section id="reward" hidden><h2 data-en="↟ The Uplift Sigil" data-zh="↟ 升力符印"></h2><p data-en="The treasure reaches the tower. The Uplift Sigil shines!" data-zh="寶藏到達塔頂，升力符印亮起了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Lift new treasures" data-zh="吊起新的寶藏"></button></section>
<details id="notes" hidden><summary data-en="Keeper’s notes · Pulleys" data-zh="守護者筆記 · 滑輪"></summary><p data-en="One fixed pulley changes the pull direction: it does not save force. Two rope sections support our movable pulley, so each carries half the load. An extra fixed pulley redirects the free end downward. Ideal pull force = load weight ÷ supporting sections; rope travel = lift height × sections. Half the force needs twice the rope travel, so work is unchanged. This slow, ideal model ignores friction, pulley/rope weight, stretching and acceleration. The keeper supplies exactly the required force up to the shown limit. Changing cranes safely lowers the chest and resets rope travel; no real-world lifting is required." data-zh="一個定滑輪改變拉力方向，不會省力。本模型的動滑輪由兩段繩支撐，所以每段承受一半負重。額外的定滑輪讓自由繩端向下拉。理想拉力＝負重÷支撐繩段數；拉繩距離＝提升高度×支撐繩段數。用一半拉力，就要拉兩倍繩長，做功不變。這個緩慢、理想模型忽略摩擦、繩和滑輪重量、伸長及加速度。守塔人提供所需拉力，但不超過顯示的上限。更換吊機時，寶箱安全放回起點並重設拉繩距離。不需要進行真實吊重活動。"></p></details>
