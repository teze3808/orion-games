<section class="mission-intro"><h1 data-en="The Indicator Lantern Lab" data-zh="指示燈籠實驗室"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three lanterns guard a forgotten laboratory. Test fictional water-based samples and select the property each lantern requests." data-zh="三盞燈籠守護被遺忘的實驗室。測試虛構水溶液，選出每盞燈要求的性質。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap each vial to test it. Then tap the sample you want and check your choice." data-zh="點選每個小瓶進行測試，再點選你要的樣本，檢查選擇。"></p><div id="diagram"></div><div class="hint-area"><button id="retry" data-en="Clear readings" data-zh="清除讀數"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Lantern request" data-zh="燈籠的要求"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Virtual samples at 25 °C. Colours are category symbols, not a real indicator colour chart." data-zh="虛擬樣本溫度為 25 °C。顏色是分類標記，並非真實指示劑色卡。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check sample ✦" data-zh="檢查樣本 ✦"></button><button id="next" class="primary" hidden data-en="Next lantern →" data-zh="下一盞燈 →"></button><section id="reward" hidden><h2  data-en="◈ The Indicator Sigil" data-zh="◈ 辨色符印"></h2><p  data-en="Three lanterns glow. The laboratory chest opens!" data-zh="三盞燈籠亮起，實驗室寶箱打開！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new samples" data-zh="探索新樣本"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · pH" data-zh="守護者筆記 · 酸鹼值"></summary><p data-en="At 25 °C, neutral aqueous solutions have pH 7. Lower values are acidic and higher values alkaline. The pH scale is logarithmic: one unit corresponds to a tenfold change in hydrogen-ion activity, not a simple added amount. Our fictional samples have fixed ideal readings, with no mixing or measurement uncertainty. Colours are category symbols only. pH alone does not tell whether a liquid is safe to drink or touch; no real liquids are needed." data-zh="在 25 °C，中性水溶液的 pH 為 7。較低是酸性，較高是鹼性。pH 是對數刻度：相差一個單位代表氫離子活度相差十倍，不是簡單加減的份量。虛構樣本有固定理想讀數，不模擬混合或測量誤差。顏色只代表分類。單靠 pH 無法判斷液體是否可飲用或觸摸；遊戲不需要真實液體。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261110"></script><script src="../../shared/progress.js?v=20261112-pixels"></script><script src="../../shared/discovery.js?v=20261112-pixels"></script><script src="game.js?v=20261110"></script></body></html>
