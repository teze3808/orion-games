<section class="mission-intro"><h1 data-en="The Cloud Cargo Vault" data-zh="雲端貨倉"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The sky captain needs three treasure deliveries. The narrow cargo cage opens only at the top. Plan your loading order to restore the cloud vault." data-zh="天空船長需要三次寶藏運送。狹窄貨籠只在頂部開口。安排裝貨次序，重開雲端貨倉。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap crates to load them. Fill the cage, then unload one at a time from the top." data-zh="點選箱子裝貨。裝滿貨籠，再從頂部逐一卸下。"></p><div id="pile" class="pile" role="img"></div><div class="loaders"><button id="load0"></button><button id="load1"></button><button id="load2"></button><button id="load3"></button></div><div class="actions"><button id="undo" data-en="Undo top crate" data-zh="撤回頂部的箱"></button><button id="pop" class="primary" data-en="Unload top crate ↓" data-zh="卸下頂部的箱 ↓"></button></div><div class="hint-area"><button id="retry" data-en="Retry this delivery" data-zh="重試這次運送"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The captain’s request" data-zh="船長的要求"></h2><p id="goal" class="goal"></p><ol id="target" class="sequence"></ol><div id="reading" role="status"></div><h3  data-en="Delivered, first → last" data-zh="已送出，最先 → 最後"></h3><ol id="received" class="sequence"></ol><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check delivery ✦" data-zh="檢查運送 ✦"></button><button id="next" class="primary" hidden data-en="Next delivery →" data-zh="下一次運送 →"></button><section id="reward" hidden><h2  data-en="▣ The Skyhold Sigil" data-zh="▣ 雲藏符印"></h2><p  data-en="Three deliveries complete. The cloud vault opens!" data-zh="三次運送完成。雲端貨倉開啟了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new deliveries" data-zh="探索新運送"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Stacks" data-zh="守護者筆記 · 堆疊"></summary><p  data-en="A stack adds and removes at the top: push adds, pop removes the most recent item. This is last in, first out (LIFO). Our puzzle loads the whole batch before unloading, so output reverses the loading order. General stacks can mix pushes and pops; real computer stacks do not need physical crates." data-zh="堆疊在頂部加入和移除資料：push 加入，pop 移除最近加入的一項，稱為後進先出（LIFO）。本謎題先裝入整批再卸下，所以輸出次序與裝入次序相反。一般堆疊可以交替 push 和 pop；真實電腦堆疊不需要實體箱子。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261027"></script><script src="../../shared/progress.js?v=20261031-ramp"></script><script src="../../shared/discovery.js?v=20261031-ramp"></script><script src="game.js?v=20261027"></script></body></html>
