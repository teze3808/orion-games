. Vapour is invisible; the dots are a model, not visible droplets. Clouds contain tiny droplets or ice crystals. We skip exact temperatures, mixtures of phases, pressure and elapsed time. Direct ice-to-vapour changes exist in nature but are outside this game. The virtual chamber keeps all its water; the treasure is story magic." data-zh="模型展示冰、液態水和水蒸氣之間的完整變化。蒸發不需要沸騰。水蒸氣看不見；圓點只是模型，不是看得見的小水滴。雲含有微小水滴或冰晶。我們省略準確溫度、多種形態共存、壓力和實際時間。自然界也有冰直接變成水蒸氣的情況，但本遊戲不模擬。虛擬容器保留全部水分；寶藏則是故事魔法。"></p><a href="https://www.usgs.gov/water-science-school/science/condensation-and-water-cycle" target="_blank" rel="noopener" data-en="Source: USGS · Water Science School" data-zh="資料：USGS · 水科學學校"></a></details></section></div></main><script src="../../shared/i18n.js?v=20260929"></script><script src="../../shared/progress.js?v=20261001-light"></script><script src="../../shared/discovery.js?v=20261001-light"></script><script src="game.js?v=20260929"></script></body></html>
