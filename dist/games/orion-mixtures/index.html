<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Crystal Alchemist’s Workshop</title><link rel="stylesheet" href="style.css?v=20260925-drag"><link rel="icon" href="data:,"><link rel="stylesheet" href="../../shared/play-layout.css?v=20260925-ipad"></head><body data-mission="mixtures"><main><header><a data-en="← Mission map" data-zh="← 任務地圖" href="../../"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header><section class="intro"><p data-en="ORION’S EXPEDITION · THE HIDDEN LABORATORY" data-zh="ORION 的探險 · 隱藏實驗室" class="eyebrow"></p><h1 data-en="The Crystal Alchemist’s Workshop" data-zh="晶石煉金工坊" ></h1><p data-en="Beneath the city, a forgotten workshop guards a crystal cabinet. Three mixed samples remain on the bench. Recover their treasures to awaken its seals." data-zh="古城地底，一間被遺忘的工坊守著晶石寶櫃。桌上留下三份混合樣本。找回其中的寶物，喚醒封印。" ></p></section><div class="adventure"><aside class="scene" id="scene"><div class="scene-caption"><p id="sceneStatus"></p><div id="seals" aria-hidden="true"></div></div></aside><section class="desk"><p class="eyebrow" id="stageLabel"></p><h2 id="stageTitle"></h2><p id="mission"></p>
<section class="goal-panel"><h3 data-en="Your treasure checklist" data-zh="你的寶物清單"></h3><div id="goals" aria-live="polite"></div></section>
<p id="stepGuide" class="step-guide" role="status"></p>
<button id="inspect" class="primary" data-en="1 · Uncover the sample" data-zh="1 · 打開樣本"></button>
<p id="sample" class="sample-label"></p>
<div class="play-surface"><div id="vessels" class="workbench"></div>
<div id="controls">
<h3 class="tool-heading" data-en="Drag a tool → jar" data-zh="拖曳工具 → 樣本瓶"></h3>
<div class="tools">
<button id="magnet" class="tool"><span class="tool-picture magnet" aria-hidden="true"></span><strong data-en="Magnet" data-zh="磁鐵"></strong><span data-en="Move it over the mixture" data-zh="在混合物上方移動"></span></button>
<button id="filter" class="tool"><span class="tool-picture filter" aria-hidden="true"></span><strong data-en="Filter" data-zh="濾紙"></strong><span data-en="Pour through filter paper" data-zh="把液體倒過濾紙"></span></button>
<button id="evaporate" class="tool"><span class="tool-picture evaporate" aria-hidden="true"></span><strong data-en="Evaporate" data-zh="蒸發"></strong><span data-en="Let the water enter the air" data-zh="讓水進入空氣"></span></button>
</div>
<p class="small" data-en="Drag onto the jar. Or tap a tool, then tap the jar." data-zh="把工具拖到瓶子上。也可以先點工具，再點瓶子。"></p>
</div>
</div><p id="feedback" role="status"></p>
<div id="finishControls"><button id="check" class="primary"></button><button id="fresh" data-en="↻ Try again with a new sample" data-zh="↻ 換新樣本，再試一次"></button></div>
<button id="next" data-en="Approach the next seal →" data-zh="走向下一道封印 →" hidden class="primary"></button><section id="reward" hidden><div class="reward-symbol">⬡</div><h2 data-en="The Crystal Sigil" data-zh="晶石符印" ></h2><p data-en="The cabinet glows. You recovered each treasure by noticing how materials behave!" data-zh="寶櫃亮起光芒。你觀察材料的特性，找回了每件寶物！" ></p><p id="saveStatus" role="status"></p><button id="retrySave" data-en="Save my sigil again" data-zh="再次儲存符印" hidden></button><a data-en="Return to my sigils" data-zh="返回我的符印" class="button" href="../../"></a><button id="replay" data-en="Explore the workshop again" data-zh="再次探索工坊" ></button></section><details><summary data-en="My observation log" data-zh="我的觀察紀錄" ></summary><ol id="log"></ol></details><div class="hint-area"><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div><details id="notes" hidden><summary data-en="Keeper’s notes · explore the science" data-zh="守護者筆記 · 探索科學" ></summary><p data-en="A magnet attracts iron. A paper filter traps insoluble sand while water and dissolved salt pass through. Evaporation transfers water to the air as water vapour, leaving salt behind. The water has not vanished!" data-zh="磁鐵吸引鐵。濾紙截留不溶於水的沙，水與已溶解的鹽則通過濾紙。蒸發使水以水蒸氣形式進入空氣，留下鹽。水並沒有消失！" ></p><p data-en="Our ideal model uses iron, quartz sand, table salt and water, with complete separation and no spills. Labels show ingredients, not visible salt grains in a solution. Real separation can be incomplete and evaporation takes time. Filtered water is not necessarily safe to drink. The glowing cabinet is story magic. Vapour wisps are a picture symbol; water vapour itself is invisible." data-zh="這個理想模型使用鐵、石英沙、食鹽和水，假設完全分離、沒有灑漏。標籤表示成分，不代表溶液中看得見鹽粒。真實分離未必完全，蒸發也需要時間。過濾後的水不一定適合飲用。發光寶櫃是故事魔法。蒸氣線條是圖像符號；水蒸氣本身看不見。" ></p><p data-en="Why does a filter separate sand from salt water, but not salt from water?" data-zh="為甚麼濾紙能把沙與鹽水分開，卻不能把鹽與水分開？" ></p></details></section></div><footer data-en="A virtual chemistry mystery. Every experiment leaves evidence. Sigils are saved in this browser." data-zh="虛擬化學解謎。每次實驗都留下證據。符印儲存在目前的瀏覽器。" ></footer></main><div id="dragGhost" hidden aria-hidden="true"></div><script src="../../shared/i18n.js?v=20260925-drag"></script><script src="../../shared/progress.js?v=20260925-drag"></script><script src="../../shared/play-layout.js?v=20260925-ipad"></script><script src="game.js?v=20260925-ipad"></script></body></html>
