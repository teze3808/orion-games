<section class="mission-intro"><h1 data-en="The Bridge of Truth" data-zh="石像的真假橋"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three stone owls guard a bridge to the lost treasury. Each owl follows a secret rule. Offer gems, watch the bridge, and discover all three rules to earn the Truth Sigil." data-zh="三隻石貓頭鷹守護通往失落寶庫的橋。每隻都遵循一個秘密規則。試放寶石、觀察橋樑，找出三個規則，獲得真理符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="Ancient owl guardians beside a misty stone bridge and treasure shrine" data-zh="古老貓頭鷹石像守護薄霧中的石橋和寶庫" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="1 · Tap gems to add or remove them. 2 · Test your offering. 3 · Compare every combination, then choose the owl’s rule." data-zh="1 · 點按寶石放入或取走。2 · 試試供奉。3 · 比較每種組合，再選出貓頭鷹的規則。"></p><p id="inputNote" class="legend"></p><div class="gem-rack"><button id="gemA" aria-pressed="false"></button><button id="gemB" aria-pressed="false"></button></div><div class="actions"><button id="test" class="primary" data-en="Test these gems ✦" data-zh="試試這些寶石 ✦"></button><button id="retry" data-en="Start this trial again" data-zh="重新測試這一關"></button></div><div class="hint-area"><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Watch the bridge" data-zh="觀察橋樑"></h2><div id="model" class="model wait"><div class="bridge-deck" aria-hidden="true"><i></i><i></i><i></i></div><span id="bridgeState" class="model-label"></span></div><p id="feedback" role="status"></p><div class="evidence"><h3 id="evidenceTitle"></h3><div id="log"></div></div><section id="ruleChoices" hidden><h3 data-en="Which rule fits ALL your tests?" data-zh="哪個規則符合所有測試？"></h3><div class="rule-buttons"><button id="and"></button><button id="or"></button><button id="not"></button></div></section><button id="next" class="primary" hidden data-en="Meet the next owl →" data-zh="拜訪下一隻貓頭鷹 →"></button><section id="reward" hidden><h2 data-en="◇ The Truth Sigil" data-zh="◇ 真理符印"></h2><p data-en="The owls bow. The path to the treasury is yours!" data-zh="石貓頭鷹向你鞠躬。通往寶庫的道路打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore a new owl order" data-zh="探索新的石像次序"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · logic" data-zh="守護者筆記 · 邏輯"></summary><p data-en="AND needs both inputs. OR accepts either input, including both together. NOT reverses one input. Gem present means true; absent means false. The moving bridge is story magic, not an electrical or structural simulation." data-zh="AND（且）需要兩個輸入都成立。OR（或）接受任何一個，包括兩個同時成立。NOT（非）把單一輸入反轉。有寶石代表真，沒有代表假。移動橋樑是故事魔法，不是電路或結構模擬。"></p><a href="https://makecode.microbit.org/blocks/logic/boolean" target="_blank" rel="noopener" data-en="Source: Microsoft MakeCode · Boolean logic" data-zh="資料：Microsoft MakeCode · 布林邏輯"></a></details></section></div></main><script src="../../shared/i18n.js?v=20260928"></script><script src="../../shared/progress.js?v=20261011-fractions"></script><script src="../../shared/discovery.js?v=20261003-shadows"></script><script src="game.js?v=20260928"></script></body></html>
