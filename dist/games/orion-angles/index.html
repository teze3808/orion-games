<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Star-Sail Loft" data-zh="星帆閣"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three triangular sails have lost their corner markings. Restore each missing angle to open the harbour keeper’s star chest." data-zh="三面三角帆遺失了角度標記。補回每個缺失的角度，打開海港守護者的星光寶箱。"></p></details></div>
<div class="scene"><img src="loft.jpg" alt="" width="1440" height="720"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p data-en="Find the missing inside angle C. The sail plan stays fixed while you try a corner on the gauge." data-zh="找出缺失的內角 C。用量角器試試角度，船帆圖則保持不變。"></p><div id="diagram"></div><p id="known"></p><label for="angle" data-en="Proposed angle C" data-zh="提出的角 C"></label> <output id="angleValue" for="angle"></output><input id="angle" type="range" min="5" max="170" step="5" value="5"><div class="buttons"><button id="less" data-en="− 5°" data-zh="− 5°" aria-label="Decrease angle by 5 degrees" data-en-aria-label="Decrease angle by 5 degrees" data-zh-aria-label="角度減少 5 度"></button><button id="more" data-en="+ 5°" data-zh="+ 5°" aria-label="Increase angle by 5 degrees" data-en-aria-label="Increase angle by 5 degrees" data-zh-aria-label="角度增加 5 度"></button></div></section><section class="result-panel"><h2 data-en="Try a corner" data-zh="試試角度"></h2><div id="gauge"></div><p data-en="The gauge shows your proposal, not the answer. ° means degrees. Adjust it, then test the sail." data-zh="量角器顯示你的提議，不是答案。° 表示度。調整後，再測試船帆。"></p><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Test the sail" data-zh="測試船帆"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next sail →" data-zh="下一面帆 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div>
<div id="reward" hidden><h3 data-en="∠ The Starcorner Sigil" data-zh="∠ 星角符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Explore new sails" data-zh="探索新船帆"></button></div></section></div></main>
