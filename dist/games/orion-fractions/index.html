<section class="mission-intro"><h1 data-en="The Mosaic Treasury" data-zh="碎片寶藏殿"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three broken mosaics guard a golden door. Match their glowing areas, even when the pieces change size, to earn the Unity Sigil." data-zh="三幅破碎拼畫守着金色大門。碎片大小改變了，也要拼出相同的發光面積，獲得合一符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="A golden door in an ancient mosaic treasury" data-zh="古老拼畫寶藏殿中的金色大門" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Choose equal pieces. Tap tiles to light them; tap again to remove. Match the golden target." data-zh="選擇等份數。點碎片讓它發光，再點可移除。拼出與金色目標相同的面積。"></p>
<label class="partition-label" for="partition" data-en="Divide the whole into…" data-zh="把整幅分成……"></label><select id="partition"></select><p class="legend" data-en="Changing the division starts a blank mosaic. Saved matches stay." data-zh="改變等份數會清空拼畫，已記錄的配對會保留。"></p>
<div class="mosaic-pair"><div><h3 data-en="Golden target" data-zh="金色目標"></h3><div id="targetBoard" class="mosaic target" aria-hidden="true"></div><p id="targetLabel"></p></div><div><h3 data-en="Your mosaic · tap the tiles" data-zh="你的拼畫 · 點擊碎片"></h3><div id="board" class="mosaic"></div><p id="amount" role="status"></p></div></div>
<p class="legend" data-en="Both rectangles are the same-sized whole. Every piece in a rectangle has equal area." data-zh="兩個長方形代表同樣大小的整體。每幅內的碎片面積相等。"></p>
<div class="hint-area"><button id="retry" data-en="Clear this seal" data-zh="清空這道封印"></button><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div><ol id="evidence"></ol><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Test my mosaic ✦" data-zh="測試我的拼畫 ✦"></button><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button>
<section id="reward" hidden><h2 data-en="▧ The Unity Sigil" data-zh="▧ 合一符印"></h2><p data-en="The mosaics shine together. The golden treasury opens!" data-zh="拼畫一起發光。金色寶庫打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new mosaics" data-zh="探索新的拼畫"></button></section>
<details id="notes" hidden><summary data-en="Keeper’s notes · equivalent fractions" data-zh="守護者筆記 · 等值分數"></summary><p data-en="A denominator counts equal parts in one whole; the numerator counts selected parts. Equivalent fractions name the same amount: for example, 1/2 = 2/4 = 3/6. Our rectangles always represent the same-sized whole, regardless of screen size. The tile borders are guides, not missing area. A larger denominator means smaller pieces for the same whole, not automatically a larger fraction. The door is story magic." data-zh="分母是整體的等份數，分子是選取的份數。等值分數表示相同的量，例如 1/2 = 2/4 = 3/6。不論螢幕大小，兩個長方形總是代表同樣大小的整體。碎片邊線只是標示，不是缺少的面積。同一整體的分母越大，每份越小，不代表分數一定越大。大門屬於故事魔法。"></p></details>
