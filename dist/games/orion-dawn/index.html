<section class="mission-intro"><h1 data-en="The Dawn Observatory" data-zh="黎明天文臺"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The ancient observatory has forgotten the rhythm of a day. Turn its model Earth, restore three observations, and open the dawn chest." data-zh="古老天文臺忘記了一天的節奏。轉動地球模型，重現三次觀察，開啟黎明寶箱。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="An ancient observatory with a brass globe and golden chest at dawn" data-zh="黎明時分，古老天文臺內的黃銅地球儀和金色寶箱" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap Turn Earth or drag the slider. Watch the gold observer move between the bright and dark sides." data-zh="輕按「轉動地球」或拖動滑桿，觀察金色標記如何在光暗兩面之間移動。"></p><div id="diagram"></div><label class="axis" for="length"><span  data-en="Rotation step" data-zh="自轉位置"></span><output id="lengthValue"></output><input id="length" type="range" min="0" max="7" step="1"></label><button id="turn" data-en="Turn Earth ↶" data-zh="轉動地球 ↶"></button><div class="hint-area"><button id="retry" data-en="Reset observation" data-zh="重設觀察"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The keeper’s observation" data-zh="守護者的觀察"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Simplified equator model: fixed sunlight, no tilt or atmosphere. The Sun and Earth are not drawn to scale." data-zh="簡化赤道模型：陽光固定，不含地軸傾斜或大氣。太陽和地球並非按比例繪製。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check observation ✦" data-zh="檢查觀察 ✦"></button><button id="next" class="primary" hidden data-en="Next observation →" data-zh="下一次觀察 →"></button><section id="reward" hidden><h2  data-en="◐ The Daybreak Sigil" data-zh="◐ 破曉符印"></h2><p  data-en="Three observations restored. The dawn chest opens!" data-zh="三次觀察重現，黎明寶箱開啟！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore another day" data-zh="探索另一天"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Day and night" data-zh="守護者筆記 · 晝夜"></summary><p data-en="Earth’s rotation carries a place into and out of sunlight. From above the North Pole it turns anticlockwise. In this equator model, the rightmost position is local solar noon, the top is sunset, the left is midnight and the bottom is sunrise. These are not clock times or time zones. We omit tilt, seasons, atmosphere and Earth’s motion around the Sun over this short demonstration. The grid and gold marker rotate with Earth; the lit half keeps facing the Sun." data-zh="地球自轉，讓一個位置進入或離開陽光。從北極上方看，地球逆時針轉動。在這個赤道模型中，最右是當地太陽正午，上方是日落，最左是午夜，下方是日出。這些不是鐘錶時間或時區。短時間示範省略地軸傾斜、季節、大氣和地球繞太陽的運動。格線和金色標記隨地球轉動，受光的一半仍面向太陽。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261104"></script><script src="../../shared/progress.js?v=20261109-inheritance"></script><script src="../../shared/discovery.js?v=20261109-inheritance"></script><script src="game.js?v=20261104"></script></body></html>
