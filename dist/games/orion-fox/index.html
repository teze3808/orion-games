<section class="mission-intro"><h1 data-en="The Clockwork Fox" data-zh="迷路的機械狐狸"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="A little brass fox has lost its route through the moonlit gardens. It can follow your instructions, but cannot guess your plan. Guide it to three treasures and earn a new companion’s Footprint Sigil." data-zh="小銅狐狸在月光花園迷路了。牠會跟着你的指令走，卻不會猜你的計劃。帶牠找到三份寶藏，獲得新伙伴的足跡符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="A brass clockwork fox explores a moonlit treasure garden" data-zh="小銅狐狸探索月光下的寶藏花園" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="1. Plan a path from 🦊 to ◆. 2. Add arrows. 3. Run!" data-zh="1. 計劃從 🦊 到 ◆ 的路線。2. 加入箭頭。3. 執行！"></p><div class="board-space"><div id="board" role="group" data-en="Garden map, five rows and five columns" data-zh="花園地圖：五行五列" data-i18n-attr="aria-label"></div></div><p class="legend" data-en="⚑ Start · ◆ Treasure · ♣ Hedge · arrows follow the screen" data-zh="⚑ 起點 · ◆ 寶藏 · ♣ 樹籬 · 箭頭依畫面方向"></p><div class="repeat-control"><label for="repeat" data-en="Repeat each new arrow" data-zh="每個新箭頭重複"></label><select id="repeat"><option value="1" data-en="×1 · once" data-zh="×1 · 一次"></option><option value="2" data-en="×2 · twice" data-zh="×2 · 兩次"></option><option value="3" data-en="×3 · three times" data-zh="×3 · 三次"></option></select></div><div class="directions"><button id="up" data-en="↑ Up" data-zh="↑ 上"></button><button id="right" data-en="→ Right" data-zh="→ 右"></button><button id="down" data-en="↓ Down" data-zh="↓ 下"></button><button id="left" data-en="← Left" data-zh="← 左"></button></div><div class="hint-area"><button id="clear" data-en="Clear plan & return fox" data-zh="清空計劃，狐狸回起點"></button><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your program → your result" data-zh="你的程式 → 執行結果"></h2><p id="queueCount"></p><div id="queue" role="group" data-en="Commands in reading order; tap one to remove it" data-zh="依閱讀順序執行的指令；點一下可刪除" data-i18n-attr="aria-label"></div><div class="run-controls"><button id="run" class="primary" data-en="▶ Run my program" data-zh="▶ 執行我的程式"></button><button id="stop" hidden data-en="■ Stop & inspect" data-zh="■ 停下來觀察"></button></div><p id="reading" role="status"></p><p id="feedback" role="status"></p><button id="next" class="primary" hidden data-en="Next garden →" data-zh="下一座花園 →"></button><section id="reward" hidden><h2 data-en="⌘ The Footprint Sigil" data-zh="⌘ 足跡符印"></h2><p data-en="Three treasures found! The fox is ready to explore with you." data-zh="找到三份寶藏了！狐狸準備好與你一起探險。"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new gardens" data-zh="探索新的花園"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · programs" data-zh="守護者筆記 · 程式"></summary><p data-en="An algorithm is a step-by-step method. This program uses absolute screen directions and a counted repeat for one movement. The fox follows every command; ending at the treasure completes a garden. Turns, sensors, nested loops and real robot physics are not modelled. Repeat is a useful shortcut; any working route is welcome." data-zh="演算法是逐步完成事情的方法。這個程式使用固定的畫面方向，並可指定一個動作重複多少次。狐狸會執行全部指令；最後停在寶藏才算完成。模型沒有模擬轉身、感應器、巢狀迴圈或真實機械物理。重複是方便的捷徑；任何可行路線都可以。"></p><a href="https://scratch.mit.edu/help/studio/tips/blocks/repeat/" target="_blank" rel="noopener" data-en="Learn more: Scratch · Repeat" data-zh="了解更多：Scratch · 重複"></a></details></section></div></main><script src="../../shared/i18n.js?v=20261004"></script><script src="../../shared/progress.js?v=20261011-fractions"></script><script src="../../shared/discovery.js?v=20261004-fox"></script><script src="game.js?v=20261004"></script></body></html>
