<section class="mission-intro"><h1 data-en="The Magnet Ferry" data-zh="磁石渡船"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three ferry locks guard a cavern treasure. Turn the dock magnet, observe the ferry, and uncover the last magnet’s hidden pole." data-zh="三道渡船鎖守着洞穴寶藏。翻轉碼頭磁石，觀察渡船，找出最後磁石隱藏的磁極。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Flip the dock magnet, then test. Watch which way the ferry moves. Both magnets are held straight and cannot turn." data-zh="翻轉碼頭磁石，再測試。觀察渡船移動的方向。兩塊磁石都固定朝向，不能自行轉動。"></p><div id="diagram"></div><p id="facing" class="legend"></p><div class="actions"><button id="flip" data-en="Flip dock magnet ↻" data-zh="翻轉碼頭磁石 ↻"></button><button id="test" class="primary" data-en="Test the magnets" data-zh="測試磁石"></button></div><p class="legend" data-en="N = north pole · S = south pole. Colours are labels, not real magnetic colours." data-zh="N = 北極 · S = 南極。顏色只是標記，不是磁極的真實顏色。"></p><div class="hint-area"><button id="retry" data-en="Clear these observations" data-zh="清除此組觀察"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The harbour keeper’s request" data-zh="港灣守護者的要求"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><h3 data-en="Your test records" data-zh="你的測試紀錄"></h3><div id="records"></div><fieldset id="guessPanel" hidden><legend data-en="Which hidden ferry pole faces the dock?" data-zh="渡船朝向碼頭的隱藏磁極是甚麼？"></legend><button id="guessN" aria-pressed="false" data-en="N · North" data-zh="N · 北極"></button><button id="guessS" aria-pressed="false" data-en="S · South" data-zh="S · 南極"></button></fieldset><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check the lock ✦" data-zh="檢查船鎖 ✦"></button><button id="next" class="primary" hidden data-en="Next ferry lock →" data-zh="下一道船鎖 →"></button><section id="reward" hidden><h2 data-en="↔ The Compass Sigil" data-zh="↔ 磁向符印"></h2><p data-en="Three locks released. The treasure ferry is ready!" data-zh="三道船鎖解開了，寶藏渡船準備好了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new ferry locks" data-zh="探索新船鎖"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · Magnetic poles" data-zh="守護者筆記 · 磁極"></summary><p data-en="Opposite poles attract; like poles repel. This model uses two aligned bar magnets with their facing ends close together. The dock magnet is fixed; the ferry moves along a guide and cannot rotate. Motion is symbolic, not a prediction of force, speed or distance. Real forces depend on magnet shape, strength and separation; water resistance is omitted. The magnets keep both poles when flipped. The hidden magnet is still a magnet, not an unmagnetised metal object. The fantasy harbour is not a real transport design." data-zh="異極相吸，同極相斥。模型使用兩塊對齊的條形磁石，相對的末端靠近。碼頭磁石固定；渡船沿導軌移動，不能轉動。移動只是示意，不預測力、速度或距離。真實作用力取決於形狀、強度和距離；模型忽略水的阻力。翻轉磁石後仍有兩個磁極。隱藏物件仍是磁石，不是未磁化的金屬。幻想港灣不是真實交通設計。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261025"></script><script src="../../shared/progress.js?v=20261026-coordinates"></script><script src="../../shared/discovery.js?v=20261026-coordinates"></script><script src="game.js?v=20261025"></script></body></html>
