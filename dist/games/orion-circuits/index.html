<details id="notes" hidden><summary data-en="Keeper’s notes · circuits" data-zh="守護者筆記 · 電路"></summary><p data-en="A lamp needs a complete path from one battery terminal, through the lamp, to the other terminal. A closed switch joins the path; an open switch leaves a gap. In the first panel both switches share one loop. In the second, each lamp has its own branch. In the third, switch C is shared by both branches." data-zh="燈需要完整通路，從電池一端經過燈，再回到另一端。閉合開關接通通路；斷開開關留下缺口。第一塊板的兩個開關在同一迴路上。第二塊板的每盞燈各有支路。第三塊板的 C 開關由兩條支路共用。"></p><p data-en="This ideal battery model shows only lit or unlit lamps, not current size, brightness differences, heating or battery life. Gold wires mark complete paths, not the movement of electricity. The gallery and sigil are story magic; the numbered diagram is the working model." data-zh="這個理想電池模型只顯示燈亮或不亮，不模擬電流大小、亮度差異、發熱或電池壽命。金色導線標記完整通路，不表示電流移動。燈廊和符印是故事魔法；編號電路圖才是操作模型。"></p><a href="https://www.eia.gov/energyexplained/electricity/batteries-circuits-and-transformers.php" target="_blank" rel="noopener" data-en="Source: EIA · Electrical circuits" data-zh="資料：EIA · 電路"></a></details></section></div></main><script src="../../shared/i18n.js?v=20260927-circuits"></script><script src="../../shared/progress.js?v=20261001-light"></script><script src="../../shared/discovery.js?v=20261001-light"></script><script src="game.js?v=20260927-lessons"></script></body></html>
