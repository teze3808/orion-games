<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap the four pictures in life-cycle order, starting with the requested stage. Use Undo to change your last choice." data-zh="從指定階段開始，依生命週期次序點選四張圖片。用「撤回」更改上一個選擇。"></p><div id="cards" class="life-cards"></div><button id="undo" data-en="Undo last picture" data-zh="撤回上一張圖片"></button><div class="hint-area"><button id="retry" data-en="Clear this mosaic" data-zh="清空此拼畫"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The gardener’s request" data-zh="園丁的要求"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="A life cycle continues across generations. Pictures are simplified and not to scale." data-zh="生命週期跨越世代延續。圖片經過簡化，並非按比例繪製。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Restore mosaic ✦" data-zh="修復拼畫 ✦"></button><button id="next" class="primary" hidden data-en="Next mosaic →" data-zh="下一幅拼畫 →"></button><section id="reward" hidden><h2  data-en="ʚɞ The Renewal Sigil" data-zh="ʚɞ 蛻變符印"></h2><p  data-en="Three life-cycle mosaics restored. The gardener’s coffer opens!" data-zh="三幅生命週期拼畫修復了，園丁寶盒開啟！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new mosaics" data-zh="探索新拼畫"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Metamorphosis" data-zh="守護者筆記 · 完全變態"></summary><p data-en="Butterflies undergo complete metamorphosis: egg, larva (caterpillar), pupa (chrysalis), adult. After mating, adult females lay eggs for a new generation; adults do not turn back into eggs. A pupa is a living stage of development, not a sleeping egg. Shapes, colours and timing vary among species. Our generic pictures omit growth stages and durations. Observe real wildlife without handling it; no specimen collection is needed." data-zh="蝴蝶經歷完全變態：卵、幼蟲（毛毛蟲）、蛹、成蝶。交配後雌成蝶產卵，開始新一代；成蝶不會變回卵。蛹是活着發育的階段，不是沉睡的卵。不同物種的形狀、顏色和時間各異。示意圖省略幼蟲多次生長和各階段時長。不需採集或觸碰真實生物。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261030"></script><script src="../../shared/progress.js?v=20261031-ramp"></script><script src="../../shared/discovery.js?v=20261031-ramp"></script><script src="game.js?v=20261030"></script></body></html>
