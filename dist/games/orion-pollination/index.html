<section class="mission-intro"><h1 data-en="The Nectar Courier" data-zh="花蜜信使"></h1><details class="story-disclosure"><summary  data-en="Read the story" data-zh="閱讀故事"></summary><p  data-en="A silent orchard guards an emerald seed chest. Help a little bee carry pollen between compatible apple flowers. Restore three flower seals to earn the Blossom Sigil." data-zh="寶藏渡船停在花蜜信使。在守護者的水池測試密封貨艙，修復三道港口封印，獲得浮航符印。"></p></details></section>

ss="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div><div id="evidence" role="status"></div><ol id="log"></ol><p id="feedback" role="status"></p><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button><section id="reward" hidden><h2 data-en="✿ The Blossom Sigil" data-zh="✿ 花信符印"></h2><p data-en="The orchard seals glow. The emerald seed chest opens!" data-zh="果園封印亮起來了。翡翠種子寶箱打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new flower journeys" data-zh="探索新的花朵旅程"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · pollination" data-zh="守護者筆記 · 傳粉"></summary><p data-en="Pollination transfers pollen from anther to stigma. Fertilization happens later; a pollen delivery does not guarantee fruit. A, B and C represent three selected mutually compatible apple varieties flowering together, not named real cultivars. Pear pollen is unsuitable for this apple task. Real compatibility and bloom timing must be checked; not all plants need another variety or an insect. Both anthers and stigmas occur on apple flowers; this diagram enlarges and simplifies their parts. The bee carries one pollen type at a time in this game, whereas real insects may carry mixtures. The chest reward is story magic." data-zh="傳粉是把花粉由花藥送到柱頭。受精在之後發生；送達花粉不保證結果。A、B、C 代表三種選定、互相相容且同期開花的蘋果品種，不是真實品種名稱。梨花粉不適合這項蘋果任務。現實中必須確認相容性和花期；不是所有植物都需要另一品種或昆蟲。蘋果花有花藥和柱頭；圖示放大並簡化了部位。遊戲蜜蜂每次只攜帶一種花粉，真實昆蟲可能攜帶混合花粉。寶箱獎勵屬於故事魔法。"></p><a href="https://fruit.umn.edu/content/flowers-to-fruit" target="_blank" rel="noopener">University
