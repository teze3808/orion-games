<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Moonlit Letter</title><link rel="stylesheet" href="style.css?v=20260925-wheel"><link rel="icon" href="data:,"><link rel="stylesheet" href="../../shared/play-layout.css?v=20260925-top-art"></head>
<body data-mission="cipher"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖">← Mission map</a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<section class="opening"><p class="eyebrow" data-en="ORION’S EXPEDITION · THE MOON ARCHIVE" data-zh="ORION 的探險 · 月光檔案館"></p><h1 data-en="The Moonlit Letter" data-zh="月光下的密信"></h1><p data-en="A silver fox waits beside a sealed observatory. Two letters and a turning wheel are all that remain of its keeper. Uncover the route, then send a reply to wake the archive." data-zh="銀色狐狸守在封閉的觀星台旁。守望者只留下兩封信和一個轉輪。找出路線，再寄出回信，喚醒沉睡的檔案館。"></p></section>
<div class="adventure"><section class="scene" aria-label="Moon archive / 月光檔案館"><p id="sceneCaption"></p></section>
<section class="desk"><p class="eyebrow" id="chapter"></p><h2 id="taskTitle"></h2><p id="instruction"></p><div class="letter"><span id="letterLabel"></span><strong id="message"></strong></div><p id="context" class="context"></p>
<div id="controls"><div class="wheel-heading"><h3 data-en="Alphabet wheel" data-zh="字母轉輪"></h3><span id="wheelValue"></span></div><div class="wheel-controls"><button id="left" type="button" data-en="↻ −1 setting" data-zh="↻ 設定 −1"></button><button id="right" type="button" data-en="↺ +1 setting" data-zh="↺ 設定 +1"></button></div><p class="wheel-help" data-en="Drag the inner ring to rotate it. Match a secret letter on the inner ring to its ordinary letter on the outer ring." data-zh="拖動內圈來旋轉。把內圈的秘密字母，對照外圈的普通字母。"></p>
<div class="wheel-legend"><span data-en="Outer ring · ordinary letters" data-zh="外圈 · 普通字母"></span><span data-en="Inner ring · secret letters" data-zh="內圈 · 秘密字母"></span></div>
<svg id="cipherWheel" viewBox="0 0 440 440" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0">
<defs><radialGradient id="wheelMetal"><stop stop-color="#304155"/><stop offset=".8" stop-color="#17283e"/><stop offset="1" stop-color="#657487"/></radialGradient><radialGradient id="innerMetal"><stop stop-color="#233345"/><stop offset=".8" stop-color="#645739"/><stop offset="1" stop-color="#c1a669"/></radialGradient></defs>
<circle cx="220" cy="220" r="211" fill="url(#wheelMetal)" stroke="#b5beca" stroke-width="2"/>
<g id="outerLetters"></g><circle cx="220" cy="220" r="164" fill="url(#innerMetal)" stroke="#dfc38b" stroke-width="2"/>
<g id="innerRing"><g id="innerLetters"></g></g>
<path d="M205 17h30v93h-30Z" fill="#f5dfa318" stroke="#f5dfa3" stroke-width="2" pointer-events="none"/>
<circle cx="220" cy="220" r="105" fill="#102237" stroke="#847456"/>
<text id="wheelCenterTitle" x="220" y="193" text-anchor="middle" class="center-label"></text><text id="wheelCenterValue" x="220" y="240" text-anchor="middle" class="center-value"></text><text id="wheelPair" x="220" y="276" text-anchor="middle" class="center-pair"></text>
<path d="M170 323q50 20 100 0m-9-4 9 4-5 8" stroke="#f0d29a" stroke-width="2" fill="none" pointer-events="none"/>
</svg>
<details class="letter-table"><summary data-en="Show all letter pairs as a table" data-zh="以表格查看所有字母配對"></summary><div class="alphabet" id="alphabet"></div></details><p id="preview" class="preview"></p>
<form id="answerForm"><label for="answer" id="answerLabel"></label><div class="answer-row"><input id="answer" maxlength="40" autocomplete="off" autocapitalize="characters" spellcheck="false"><button type="submit" data-en="Test the seal" data-zh="試開封印"></button></div></form></div>
<p id="status" role="status" aria-live="polite"></p><button id="next" type="button" hidden data-en="Open the next letter →" data-zh="打開下一封信 →"></button>
<div id="treasure" hidden><div class="sigil">☾</div><h2 data-en="The Moonlight Sigil" data-zh="月光符印"></h2><p id="reward" role="status"></p><p data-en="You read the keeper’s route and wrote a secret reply. The observatory glows again!" data-zh="你讀懂了守望者的路線，還寫出秘密回信。觀星台再次亮起！"></p><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" type="button" data-en="Read the letters again" data-zh="再次解讀密信"></button></div>
<div class="hint-area"><button id="hint" class="rune" type="button" aria-label="Reveal a clue / 顯示提示" aria-expanded="false" aria-controls="hints">✧</button><ol id="hints" hidden></ol></div>
<details id="notes" hidden><summary data-en="Keeper’s notes · for curious explorers and parents" data-zh="守望者筆記 · 給好奇的探險家與家長"></summary><p data-en="This is a Caesar cipher: encryption moves every letter forward by the same number of places; decryption moves backward. After Z, wrap around to A. Spaces stay unchanged. The wheel has only 26 settings, so someone can try every one. It teaches encryption, but it is not secure for real secrets." data-zh="這是凱撒密碼（Caesar cipher）：加密時，每個字母向前移動相同的格數；解密時則向後移動。Z 之後繞回 A，空格不變。轉輪只有 26 種設定，別人可以逐一嘗試。它適合學習加密，不能保護真正的秘密。"></p><p data-en="Ask: Why does the same setting work for every letter? How can you undo a shift? Why does trying all settings break this cipher?" data-zh="一起想想：為何每個字母都用相同設定？怎樣把字母移回原位？為何逐一嘗試所有設定就能破解？"></p></details>
</section></div><footer data-en="No hurry. Every attempt is a clue. Your sigils are saved in this browser only." data-zh="不用急，每次嘗試都是線索。符印只儲存在目前的瀏覽器。"></footer>
</main><script src="../../shared/i18n.js?v=20260925-wheel"></script><script src="../../shared/progress.js?v=20260925-wheel"></script><script src="../../shared/play-layout.js?v=20260925-top-art"></script><script src="game.js?v=20260925-ipad"></script></body></html>
