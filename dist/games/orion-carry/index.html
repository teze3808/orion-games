<body data-mission="carry"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Carry Lantern Vault" data-zh="進位燈寶庫"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The counting lanterns have lost their totals. Add the two rows and guide carried light into the next column to restore three locks." data-zh="計數燈失去了總數。把兩行相加，將進位的光送往左邊一欄，修復三道鎖。"></p></details></div>
<div class="scene"><img src="vault.jpg" alt="" width="1440" height="720"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p id="instruction"></p><div id="board"></div><p class="key" data-en="Tap ? → 0 → 1. Fill every sum and carry box, including zeros." data-zh="點選 ? → 0 → 1。填好每格答案和進位，包括 0。"></p><button id="clear" data-en="Clear entries" data-zh="清空填寫"></button></section><section class="result-panel"><h2 data-en="Light moves left" data-zh="進位向左走"></h2><p data-en="Start at the right. Add the two bits and any carry arriving above them. Put the answer bit below; send any carry one column left." data-zh="由右邊開始，把兩個位元和上方收到的進位相加。答案的位元填在下方；需要進位時，送到左邊一欄。"></p><p data-en="Column values are 8, 4, 2 and 1. A lit 1 counts that value; a dark 0 counts nothing. The rune reveals the addition rules." data-zh="各欄代表 8、4、2、1。亮起的 1 計入該數值，暗下的 0 不計入。小符文會逐步揭示加法規則。"></p><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Check addition" data-zh="檢查加法"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next lock →" data-zh="下一道鎖 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div>
<div id="reward" hidden><h3 data-en="⇖ The Carrylight Sigil" data-zh="⇖ 進光符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Explore new sums" data-zh="探索新加法"></button></div></section></div></main>
