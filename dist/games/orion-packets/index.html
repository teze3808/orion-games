<section class="mission-intro"><h1 data-en="The Star Post" data-zh="星光郵局"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The star keeper’s messages arrive in scattered pieces. Restore their order, ignore repeated packets, and request a missing piece to awaken the Delivery Sigil." data-zh="星辰守護者的訊息散成碎片。恢復次序、忽略重複封包、要求補送遺失碎片，喚醒傳訊符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="Brass message tubes and sealed letters in a moonlit star post" data-zh="月光星郵局中的黃銅訊息管與密封信件" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Choose an arriving packet, then tap its place in the rebuilt message. To undo, tap a filled place with no packet selected." data-zh="選擇收到的封包，再點按重組訊息中的位置。沒有選取封包時，點按已填位置可移除。"></p><div class="tube" aria-hidden="true">✉ ⇢ ✉ ⇢ ✉</div><h3 data-en="Arrival tray" data-zh="收件盤"></h3><div id="tray"></div><p id="selection" role="status"></p><button id="cancel" data-en="Put selected packet down" data-zh="放下所選封包"></button><div id="requestBox"><label for="requestNumber" data-en="Request packet number" data-zh="要求補送封包編號"></label><select id="requestNumber"><option>1</option><option>2</option><option>3</option><option>4</option></select><button id="request" data-en="Request again ↻" data-zh="要求補送 ↻"></button></div><div class="hint-area"><button id="retry" data-en="Clear this message" data-zh="清除此訊息"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><p id="goal" class="goal"></p><h3 data-en="Rebuilt message · places 1 → 4" data-zh="重組訊息 · 位置 1 → 4"></h3><div id="slots"></div><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Deliver the message ✦" data-zh="送出訊息 ✦"></button><button id="next" class="primary" hidden data-en="Open the next delivery →" data-zh="打開下一封訊息 →"></button><section id="reward" hidden><h2 data-en="✉ The Delivery Sigil" data-zh="✉ 傳訊符印"></h2><p data-en="Three messages restored. The star post shines again!" data-zh="三封訊息已重組，星光郵局再次閃耀！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new messages" data-zh="探索新訊息"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · Reliable delivery" data-zh="守護者筆記 · 可靠傳送"></summary><p data-en="Sequence information helps a receiver restore order and recognise duplicate data. Missing data may be retransmitted. This toy protocol numbers four whole packets, each carrying one symbol. Real TCP numbers bytes, uses acknowledgements, checksums, timers and flow/congestion control. Not every network protocol guarantees delivery. Our request button is a simplified resend model, not a real network connection. Equal symbols with different numbers are separate data; copies with the same number must not be delivered twice." data-zh="次序資訊幫接收方恢復順序、識別重複資料。遺失資料可以重傳。本玩具協定為四個完整封包編號，每個載有一個符號。真實 TCP 為位元組編號，並使用確認、檢查碼、計時器及流量與擁塞控制。不是所有網絡協定都保證送達。補送按鈕是簡化重傳模型，不是真實網絡連線。符號相同但編號不同，是獨立資料；編號相同的副本不可送出兩次。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261020"></script><script src="../../shared/progress.js?v=20261025-magnets"></script><script src="../../shared/discovery.js?v=20261025-magnets"></script><script src="game.js?v=20261020"></script></body></html>
