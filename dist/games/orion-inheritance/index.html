<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap each box to combine its top letter with its side letter. Fill all four, then check." data-zh="點選每格，把上方和左方的字母組合。填好四格，再檢查。"></p><div id="diagram"></div><div class="hint-area"><button id="retry" data-en="Clear chart" data-zh="清除圖表"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Parent plants" data-zh="親本植物"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Each box is one equally likely possibility, not one promised plant. Purple/white pictures follow your chosen letters." data-zh="每格是一種機會相等的可能配對，並非一定長出的一株植物。紫花和白花圖片按你選的字母顯示。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check chart ✦" data-zh="檢查圖表 ✦"></button><button id="next" class="primary" hidden data-en="Next cross →" data-zh="下一組配對 →"></button><section id="reward" hidden><h2  data-en="❦ The Heritage Sigil" data-zh="❦ 傳承符印"></h2><p  data-en="Three charts restored. The seed chest opens!" data-zh="三張遺傳圖修復，種子寶箱打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new crosses" data-zh="探索新配對"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Inheritance" data-zh="守護者筆記 · 遺傳"></summary><p data-en="P and p are two versions (alleles) of one gene in a simplified pea flower-colour model. Each offspring receives one allele from each parent. PP and Pp give purple flowers; pp gives white. Dominant does not mean better or more common. Each square has probability 1/4 in this model, even when two squares have the same letters. A batch of four plants need not match these proportions. Many real traits involve several genes and environmental effects. Flowers are symbolic drawings; no real breeding is required." data-zh="P 和 p 是簡化豌豆花色模型中同一基因的兩種版本（等位基因）。每株後代從兩株親本各取得一個。PP 和 Pp 開紫花；pp 開白花。顯性不代表更好或更常見。模型中每格機會為四分之一，即使兩格字母相同也各佔一份。實際四株植物不一定符合這比例。許多真實性狀涉及多個基因和環境影響。花朵是示意圖，無須進行真實育種。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261109"></script><script src="../../shared/progress.js?v=20261110-ph"></script><script src="../../shared/discovery.js?v=20261110-ph"></script><script src="game.js?v=20261109"></script></body></html>
