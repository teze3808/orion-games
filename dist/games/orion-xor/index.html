<section class="mission-intro"><h1 data-en="The Twin Lantern Vault" data-zh="雙燈寶庫"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Two rows of ancient lanterns feed a mysterious vault. Change your row to recreate three lost light patterns and discover its secret rule." data-zh="兩排古燈連接神秘寶庫。改變你的燈號，重現三個失落的圖案，發現古燈的秘密規則。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap a switch below to change its light. Make the result on the right match the target." data-zh="輕按下方開關改變燈號，讓右邊的結果與目標相同。"></p><div id="diagram"></div><div class="switches"><button id="bit0" aria-pressed="false"></button><button id="bit1" aria-pressed="false"></button><button id="bit2" aria-pressed="false"></button><button id="bit3" aria-pressed="false"></button></div><div class="hint-area"><button id="retry" data-en="Clear switches" data-zh="重設開關"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The vault’s light pattern" data-zh="寶庫燈號"></h2><div id="goal" class="goal"></div><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Read all four lights from left to right. You can change any switch as often as you like." data-zh="由左至右比較四盞燈，可不限次數改變任何開關。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check seal ✦" data-zh="檢查封印 ✦"></button><button id="next" class="primary" hidden data-en="Next seal →" data-zh="下一道封印 →"></button><section id="reward" hidden><h2  data-en="⊕ The Switchlight Sigil" data-zh="⊕ 轉光符印"></h2><p  data-en="Three patterns restored. The lantern vault opens!" data-zh="三個燈號重現，古燈寶庫開啟！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new patterns" data-zh="探索新燈號"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · XOR" data-zh="守護者筆記 · 互斥或"></summary><p data-en="XOR compares two bits in the same position. Different bits give 1; matching bits give 0. A switch set to 1 flips the incoming bit, while 0 keeps it. Flipping twice restores the original. These lanterns represent four bits of data, not real light mixing or an electrical circuit. This simple puzzle is not secure encryption." data-zh="XOR 比較相同位置的兩個位元。不同得 1，相同得 0。開關設為 1 會反轉傳入位元，設為 0 會保留它。反轉兩次便回復原狀。古燈代表四個資料位元，不是真實混光或電路；這個簡單謎題不是安全加密。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261102"></script><script src="../../shared/progress.js?v=20261105-garden"></script><script src="../../shared/discovery.js?v=20261105-garden"></script><script src="game.js?v=20261102"></script></body></html>
