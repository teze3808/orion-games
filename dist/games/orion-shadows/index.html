gils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new shadow seals" data-zh="探索新的影子封印"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · shadows" data-zh="守護者筆記 · 影子"></summary><p data-en="An opaque pillar blocks light. Its shadow points away from the light. For the same upright pillar on level ground, a higher light angle gives a shorter shadow. This top view uses four directions and two light heights, with ideal parallel rays. It is a virtual light experiment, not a real Sun path or clock: location, season, time, clouds and soft edges are omitted. Never look directly at the Sun." data-zh="不透光石柱擋住光，影子便指向背光的一方。同一根直立石柱放在平地上，光的角度越高，影子越短。這個俯視模型只有四個方向、兩種光源高度，並假設光線平行。這是虛擬光線實驗，不是真實太陽路徑或時鐘：省略地點、季節、時間、雲和柔和影子邊緣。不要直視太陽。"></p><a href="https://science.nasa.gov/solar-system/skywatching/night-sky-network/tropical-solstice-shadows/" target="_blank" rel="noopener" data-en="Source: NASA · Solstice shadows" data-zh="資料：NASA · 至日影子"></a></details></section></div></main><script src="../../shared/i18n.js?v=20261003"></script><script src="../../shared/progress.js?v=20261011-fractions"></script><script src="../../shared/discovery.js?v=20261003-shadows"></script><script src="game.js?v=20261003"></script></body></html>
