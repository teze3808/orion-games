<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language" aria-label="Language / 語言"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<section class="mission-intro"><h1 data-en="The Whispering Archive" data-zh="低語檔案館"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="A narrow brass tube leads into a sealed library. Pack rune messages, restore them exactly and choose the smaller parcel to earn the Memory Sigil." data-zh="細小銅管通往封閉圖書館。打包符文訊息、完整還原，再選較小的包裹，獲得記憶符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="A brass message tube and treasure book in an ancient library" data-zh="古老圖書館中的銅製傳訊管和寶藏書" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p id="instruction" class="instruction"></p><h3 id="sourceTitle"></h3><div id="source" class="rune-strip" role="img"></div>
<div id="workbench"><div id="symbols" class="symbols"></div><div id="packing"><label for="count" data-en="How many in this run?" data-zh="這一段有多少個？"></label><select id="count"></select><button id="add" data-en="Pack this run ↓" data-zh="打包這一段 ↓"></button></div><div id="parcel" class="rune-strip" role="img"></div><div class="edit-actions"><button id="undo" data-en="↶ Undo last" data-zh="↶ 撤回最後一步"></button><button id="expand" data-en="Unpack to preview ↗" data-zh="解開預覽 ↗"></button></div></div>
<div id="choices" class="choices" hidden></div><p class="legend" data-en="Storage rule: 1 slot per raw rune; 2 slots per packed pair (rune + count). Counts 1–9. Model units, not real file bytes." data-zh="儲存規則：每個原符文佔 1 格；每組打包配對（符文＋數量）佔 2 格。數量為 1–9。模型單位，不是真實檔案位元組。"></p>
<div class="hint-area"><button id="retry" data-en="Clear this message" data-zh="清空這則訊息"></button><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div><ol id="evidence"></ol><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Send my parcel ✦" data-zh="傳送我的包裹 ✦"></button><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button>
<section id="reward" hidden><h2 data-en="▤ The Memory Sigil" data-zh="▤ 記憶符印"></h2><p data-en="The archive remembers. Its bronze treasure book opens!" data-zh="檔案館記起來了，青銅寶藏書打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new messages" data-zh="探索新的訊息"></button></section>
<details id="notes" hidden><summary data-en="Keeper’s notes · run-length encoding" data-zh="守護者筆記 · 遊程編碼"></summary><p data-en="Run-length encoding stores adjacent identical symbols as a symbol and count. Their order must stay unchanged. Our raw rune costs 1 slot and each pair costs 2; counts are 1–9 and we ignore file headers. These are model slots, not actual bytes. Some messages become larger; ties are possible. Lossless means we can restore the original exactly. Compression is not encryption or secrecy." data-zh="遊程編碼把相鄰相同符號記成符號和數量，原有次序必須保留。本模型每個原符文佔 1 格，每組配對佔 2 格；數量限 1–9，忽略檔案標頭。這些是模型格數，不是真實位元組。有些訊息會變大，也可能一樣大。無損表示能完整還原原文。壓縮不是加密，也不提供保密。"></p></details>
</section></div></main><script src="../../shared/i18n.js?v=20261013"></script><script src="../../shared/progress.js?v=20261014-moonphases"></script><script src="../../shared/discovery.js?v=20261014-moonphases"></script><script src="game.js?v=20261013"></script></body></html>
