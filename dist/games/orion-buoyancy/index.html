ata-zh="打開下一道封印 →"></button><section id="reward" hidden><h2 data-en="⚓ The Afloat Sigil" data-zh="⚓ 浮航符印"></h2><p data-en="The harbour seals shine. The treasure ferry can sail!" data-zh="港口封印亮起來了。寶藏渡船可以出航！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new cargo challenges" data-zh="探索新的貨艙挑戰"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · density" data-zh="守護者筆記 · 密度"></summary><p data-en="Average density is total mass divided by outer volume, including enclosed air. Our water is modelled as 1 kg per litre: lower density floats at the surface; higher density sinks. Equal density can remain fully submerged without rising or sinking. Capsules are sealed and rigid; resizing does not change mass in this ideal model. We ignore flooding, waves, drag, air buoyancy and stability. The diagram shows a qualitative final position, not a measured speed or time. Litres measure volume, kilograms measure mass; neither alone decides floating." data-zh="平均密度是總質量除以外部體積，包括內部空氣。本模型的水每公升為 1 公斤：密度較小會浮在水面，較大會下沉。密度相等時可完全浸在水中而不上浮或下沉。貨艙密封且堅硬；理想模型中改變體積不改變質量。沒有模擬漏水、波浪、阻力、空氣浮力或穩定性。圖示是概略最終位置，不是實測速度或時間。公升量度體積，公斤量度質量；單靠其中一項不能判斷浮沉。"></p><a href="https://openstax.org/books/university-physics-volume-1/pages/14-4-archimedes-principle-and-buoyancy" target="_blank" rel="noopener">OpenStax · Buoyancy / 浮力</a></details></section></div></main><script src="../../shared/i18n.js?v=20261009"></script><script src="../../shared/progress.js?v=20261011-fractions"></script><script src="../../shared/discovery.js?v=20261011-fractions"></script><script src="game.js?v=20261009"></script></body></html>
