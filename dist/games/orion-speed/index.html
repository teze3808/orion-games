<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Starwind Courier</title><link rel="icon" href="../../shared/favicon.svg?v=20261011-key"><link rel="stylesheet" href="style.css?v=20261126"><link rel="stylesheet" href="../../shared/discovery.css?v=20261020"></head><body data-mission="speed"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Starwind Courier" data-zh="星風信使"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The courier’s three flight records have lost their average speeds. Restore the records to open the moonlit harbour chest." data-zh="信使的三份航程紀錄遺失了平均速率。修復紀錄，打開月光港灣的寶箱。"></p></details></div>
<div class="scene"><img src="courier.jpg" alt="" width="1440" height="720"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p data-en="Read the distance and elapsed time of each part. Find one steady speed that covers the same total distance in the same total time." data-zh="讀取各段的路程及經過時間。找出一個固定速率，在相同總時間內走完相同總路程。"></p><div id="log"></div><p id="totals"></p><p class="units" data-en="m = metres · s = seconds · m/s = metres per second" data-zh="m = 米 · s = 秒 · m/s = 米每秒"></p><label for="speed" data-en="Proposed average speed" data-zh="提出的平均速率"></label> <output id="speedValue" for="speed"></output><input id="speed" type="range" min="1" max="30" step="1" value="1"><div class="buttons"><button id="less">− 1</button><button id="more">+ 1</button><button id="reset" data-en="Reset model" data-zh="重設模型"></button></div></section>
<section class="result-panel"><h2 data-en="Compare the journeys" data-zh="比較全程"></h2><div id="comparison"></div><p id="preview"></p><p data-en="The bars compare distances, not flight paths. The model travels steadily; the recorded courier may change speed or stop." data-zh="長條比較路程，不是飛行路徑。模型以固定速率移動；紀錄中的信使可能變速或停留。"></p><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Seal the record" data-zh="封存紀錄"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next record →" data-zh="下一份紀錄 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div><div id="reward" hidden><h3 data-en="➶ The Starwind Sigil" data-zh="➶ 星風符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Explore new records" data-zh="探索新紀錄"></button></div></section></div></main>
