<details id="notes" hidden><summary data-en="Keeper’s notes · Relative time" data-zh="守護者筆記 · 相對年代"></summary><p data-en="In undisturbed sedimentary layers, lower layers were deposited before the layers above. This tells us relative order, not ages in years. Our four cards are labelled samples, not a universal sequence of fossil evolution. Fossil pictures identify cards; their shapes do not tell you their ages. Folding, overturning, faults, erosion gaps and intrusions are outside this model. The treasure marker is a fictional event on the timeline, not a claim that human treasure is as old as these fossils." data-zh="未受擾動的沉積岩層中，下層比上層更早沉積。這能告訴我們先後次序，不能告訴我們多少年前。四張卡是有標記的樣本，不是通用的化石演化次序。化石圖案用來辨認卡片，形狀本身不能告訴你年代。本模型不包括褶皺、倒轉、斷層、侵蝕缺失和岩漿侵入。寶藏標記是時間線上的虛構事件，不代表人類寶藏與化石一樣古老。"></p></details></section></div></main>
