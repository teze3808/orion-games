<section class="intro"><p class="eyebrow" data-en="ORION’S EXPEDITION · THE ENGINEER’S CHAMBER" data-zh="ORION 的探險 · 工程師密室"></p><h1 data-en="The Counterweight Vault" data-zh="配重密庫"></h1><p data-en="Deep beneath the lost city, three bronze seals guard an engineer’s treasure. The beam still moves. Can you discover how to keep it level?" data-zh="失落古城的地底，三道青銅封印守著工程師的寶藏。橫桿仍能轉動。你能找出讓它保持水平的方法嗎？"></p></section>
<div class="adventure"><aside class="scene" id="scene"><div class="scene-caption"><span class="eyebrow" data-en="THE COUNTERWEIGHT VAULT" data-zh="配重密庫"></span><p id="sceneStatus"></p><div id="seals" aria-hidden="true"></div></div></aside>
<section class="desk"><p class="eyebrow" id="stageLabel"></p><h2 id="stageTitle"></h2><p id="mission"></p>
<div class="instrument"><div class="instrument-heading"><span data-en="Keeper’s working model" data-zh="守護者的操作模型"></span><span data-en="Equal spacing · identical blocks" data-zh="等距刻度 · 相同砝碼"></span></div><svg id="diagram" viewBox="0 0 640 240" role="img" aria-label="Lever model / 槓桿模型"><defs><linearGradient id="brass" x2="0" y2="1"><stop stop-color="#e8ca80"/><stop offset="1" stop-color="#6b512a"/></linearGradient></defs><path d="M290 207 L320 120 L350 207Z" fill="url(#brass)" stroke="#ead59a"/><g id="beam"><rect x="32" y="115" width="576" height="12" rx="6" fill="url(#brass)"/><g id="ticks"></g><g id="leftLoad"></g><g id="rightLoad"></g><rect id="dragHandle" x="335" y="12" width="56" height="110" rx="12" fill="transparent" stroke="#c4fff0" stroke-dasharray="5 4"/></g><circle cx="320" cy="121" r="9" fill="#162e30" stroke="#e3c887"/><text id="pivotLabel" x="320" y="233" text-anchor="middle"></text></svg><p id="reading" aria-live="polite"></p></div>
<p id="fixedLoad" class="fixed"></p>
<p class="drag-help" data-en="↔ Drag the glowing right-hand weight, or tap a position on the right half of the beam." data-zh="↔ 拖動右邊發光的砝碼，或點選橫桿右半邊的位置。"></p>
<div id="controls"><div class="adjustments">
<section class="adjustment"><label for="distance" data-en="1 · Choose a position" data-zh="1 · 選擇位置"></label><output id="distanceValue" for="distance"></output><input id="distance" type="range" min="1" max="6" step="1" value="1"><div class="range-ends"><span data-en="Near the pivot" data-zh="靠近支點"></span><span data-en="Farther away" data-zh="遠離支點"></span></div></section>
<section class="adjustment"><label for="mass" data-en="2 · Number of blocks" data-zh="2 · 砝碼數量"></label><div class="weight-stepper"><button id="lessMass" type="button" aria-label="Remove one block" data-en="Remove one block" data-zh="減少一個砝碼" data-i18n-attr="aria-label">−</button><output id="massValue" for="mass"></output><button id="moreMass" type="button" aria-label="Add one block" data-en="Add one block" data-zh="增加一個砝碼" data-i18n-attr="aria-label">+</button></div><input id="mass" type="range" min="1" max="4" step="1" value="2"><p id="massHelp"></p></section>
</div>
<fieldset><legend data-en="3 · Predict, then release" data-zh="3 · 先預測，再放開橫桿"></legend><div class="predictions"><button type="button" data-prediction="left" aria-pressed="false" data-en="Left drops ↙" data-zh="左邊下降 ↙"></button><button type="button" data-prediction="balanced" aria-pressed="false" data-en="Stays level ↔" data-zh="保持水平 ↔"></button><button type="button" data-prediction="right" aria-pressed="false" data-en="Right drops ↘" data-zh="右邊下降 ↘"></button></div></fieldset><button id="test" class="primary" type="button" data-en="Release the beam" data-zh="放開橫桿"></button></div>
<p id="feedback" role="status"></p><p id="solutions"></p><button id="next" class="primary" hidden data-en="Approach the next seal →" data-zh="走向下一道封印 →"></button>
<section id="reward" hidden><div class="reward-symbol" aria-hidden="true">⚙</div><h2 data-en="The Ingenuity Sigil" data-zh="巧思符印"></h2><p data-en="The vault answers with a golden glow. You found different designs that share the same balance!" data-zh="密庫亮起金色光芒。你找到不同的設計，達成同樣的平衡！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore the mechanism again" data-zh="再次探索機關"></button></section>
<details id="observations"><summary data-en="My observation log" data-zh="我的觀察紀錄"></summary><p data-en="Compare your trials. What changes when the same load moves farther from the pivot?" data-zh="比較各次嘗試。同樣的砝碼離支點更遠時，有甚麼改變？"></p><ol id="log"></ol></details>
<div class="hint-area"><button id="hint" class="rune" aria-controls="hints" aria-expanded="false" aria-label="Reveal a clue / 顯示提示">✧</button><ol id="hints" hidden></ol></div>
<details id="notes" hidden><summary data-en="Engineer’s notes · explore the science" data-zh="工程師筆記 · 探索科學"></summary><p data-en="A load has more turning effect when it is farther from the pivot. With identical blocks and equal spacing, compare blocks × distance on each side. Equal products balance this model. Engineers call the turning effect torque." data-zh="砝碼離支點越遠，轉動效果越大。砝碼相同、刻度等距時，比較兩邊的「砝碼數量 × 距離」。乘積相等，這個模型就平衡。工程師把這種轉動效果稱為力矩。"></p><p data-en="This ideal model uses a rigid beam with negligible weight and a frictionless pivot. All blocks feel the same gravity. The tilt only shows which side starts to drop; it is not a calculated motion or final angle. Real machines also have friction and their own weight. The glowing vault and sigil are story magic." data-zh="這是理想模型：橫桿堅硬，重量忽略不計，支點沒有摩擦；所有砝碼受相同重力影響。傾斜只表示哪邊開始下降，不是計算出的運動或最終角度。真實機器還有摩擦和自身重量。發光密庫與符印是故事中的魔法。"></p><p data-en="Try explaining why 2 blocks at distance 6 and 4 blocks at distance 3 can balance the same load." data-zh="試解釋為何 2 個砝碼放在距離 6，與 4 個砝碼放在距離 3，可以平衡同一負載。"></p><a href="https://openstax.org/books/physics/pages/9-3-simple-machines" target="_blank" rel="noopener" data-en="Science source: OpenStax · Simple Machines" data-zh="科學資料：OpenStax · 簡單機械"></a></details>
</section></div><footer data-en="A virtual engineering adventure. Take your time; every test is evidence. Sigils are saved in this browser." data-zh="虛擬工程探險。不用急，每次測試都是證據。符印儲存在目前的瀏覽器。"></footer></main><script src="../../shared/i18n.js?v=20260925-drag"></script><script src="../../shared/progress.js?v=20260925-drag"></script><script src="game.js?v=20260925-drag"></script></body></html>
