" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new signals" data-zh="探索新的訊號"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · parity" data-zh="守護者筆記 · 同位元檢查"></summary><p  data-en="One extra bit makes the total number of 1s even. An odd number of changed bits triggers an alarm; an even number can pass unnoticed. One parity bit cannot locate or repair an error, and no alarm does not prove a message is unchanged. The original row is shown only for learning; a receiver normally has no such reference. This is a single-row model, not two-dimensional parity or encryption." data-zh="一個額外位元令 1 的總數變成偶數。奇數個位元改變會觸發警報；偶數個可能不被發現。單個同位元不能找出或修復錯誤，沒有警報也不代表訊息未改變。原始燈號只供學習比較；接收者通常沒有這個參考。這是單行模型，不是二維檢查或加密。"></p><a href="https://classic.csunplugged.org/activities/error-detection/" target="_blank" rel="noopener">CS Unplugged · Error detection</a></details></section></div></main><script src="../../shared/i18n.js?v=20261006"></script><script src="../../shared/progress.js?v=20261011-fractions"></script><script src="../../shared/discovery.js?v=20261006-signal"></script><script src="game.js?v=20261006"></script></body></html>
