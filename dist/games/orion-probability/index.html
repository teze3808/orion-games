<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Chance Compass</title><link rel="stylesheet" href="../../shared/play-layout.css?v=20260927-single-progress"><link rel="stylesheet" href="style.css?v=20261017"><link rel="stylesheet" href="../../shared/discovery.css?v=20261017"><link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg?v=20261011-key"></head><body class="play-layout" data-mission="probability"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language" aria-label="Language / 語言"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<section class="mission-intro"><h1 data-en="The Chance Compass" data-zh="機遇羅盤"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The navigator’s compass chooses a passage by drawing a gem. Build three gem bags, investigate their chances, and awaken the Possibility Sigil." data-zh="航海家的羅盤抽取寶石來選通道。設計三個寶石袋，調查抽中的機會，喚醒可能符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="An antique compass and gem pouch in a lantern-lit navigator’s room" data-zh="燈光照亮航海室的古老羅盤與寶石袋" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Fill the bag to match the mission. Draw and replace 10 gems, then compare the colours’ chances on the NEXT draw." data-zh="按任務要求裝好寶石袋。抽取並放回 10 次，再比較下一次抽中兩色的機會。"></p><div id="bag" role="img"></div>
<div class="gem-controls"><div><label for="red" data-en="♦ Red gems" data-zh="♦ 紅寶石"></label><output id="redCount"></output><input id="red" type="range" min="0" max="8" step="1" value="1"><div class="step-buttons"><button id="redLess" data-en="− Red" data-zh="− 紅色"></button><button id="redMore" data-en="+ Red" data-zh="+ 紅色"></button></div></div><div><label for="blue" data-en="● Blue gems" data-zh="● 藍寶石"></label><output id="blueCount"></output><input id="blue" type="range" min="0" max="8" step="1" value="1"><div class="step-buttons"><button id="blueLess" data-en="− Blue" data-zh="− 藍色"></button><button id="blueMore" data-en="+ Blue" data-zh="+ 藍色"></button></div></div></div>
<div class="draw-actions"><button id="draw" class="primary" data-en="Draw & replace ×10" data-zh="抽取並放回 ×10"></button><button id="stop" hidden data-en="Stop drawing" data-zh="停止抽取"></button></div><p class="legend" data-en="Every gem is equally likely. Each gem goes back before the next draw. Changing the bag clears its tally." data-zh="每顆寶石被抽中的機會相同。每次放回，再抽下一次。改變袋中寶石會清除紀錄。"></p><div class="hint-area"><button id="retry" data-en="Try this mission again" data-zh="重試這個任務"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="chances" class="goal"></div><div id="tally" role="status"></div><p class="legend" data-en="A tally records what happened. It does not change the next draw’s chances." data-zh="紀錄顯示已發生的結果，不會改變下一次抽取的機會。"></p><p data-en="Which is more likely NEXT?" data-zh="下一次，哪個機會較大？"></p><div class="choices"><button id="chooseRed" data-en="♦ Red" data-zh="♦ 紅色"></button><button id="chooseEqual" data-en="Equal" data-zh="相同"></button><button id="chooseBlue" data-en="● Blue" data-zh="● 藍色"></button></div><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check my design ✦" data-zh="檢查我的設計 ✦"></button><button id="next" class="primary" hidden data-en="Open the next passage →" data-zh="打開下一條通道 →"></button>
<section id="reward" hidden><h2 data-en="✣ The Possibility Sigil" data-zh="✣ 可能符印"></h2><p data-en="Three passages open. You can explain the compass’s chances!" data-zh="三條通道打開了。你能解釋羅盤的機會了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new chances" data-zh="探索新的機會"></button></section>
<details id="notes" hidden><summary data-en="Keeper’s notes · Probability" data-zh="守護者筆記 · 概率"></summary><p data-en="Chance = matching gems ÷ all gems, when each individual gem is equally likely. Our virtual bag replaces every gem and mixes again, so earlier outcomes do not change later chances. Long-run proportions tend toward the theoretical chances, but a short tally can differ and need not improve at every step. The computer uses pseudorandom draws; the compass and treasure are fictional. Shapes distinguish colours for accessibility, and have no effect on selection. Your reward depends on your design and explanation, never on lucky results." data-zh="每顆寶石機會相同時，抽中某種寶石的機會＝該種寶石數量÷總數。虛擬袋每次都放回寶石並重新混合，所以之前的結果不會改變之後的機會。長期比例傾向理論機會，但短期紀錄可以不同，也不一定每一步都更接近。電腦使用偽隨機抽取；羅盤與寶藏是虛構的。形狀方便辨認顏色，不會影響抽取。獎勵取決於設計和解釋，絕不取決於運氣。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261017"></script><script src="../../shared/progress.js?v=20261018-insulation"></script><script src="../../shared/discovery.js?v=20261018-insulation"></script><script src="game.js?v=20261017"></script></body></html>
