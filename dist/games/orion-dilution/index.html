<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Use the sliders to prepare a virtual mixture. Volume means the final solution, not water alone." data-zh="用滑桿準備虛擬溶液。體積指最後溶液，不只是水。"></p><div id="diagram"></div><label class="axis" for="amount"><span  data-en="Dissolved colour · units" data-zh="已溶色素 · 份"></span><output id="amountValue"></output><input id="amount" type="range" min="0" max="12" step="1"></label><label class="axis" for="volume"><span  data-en="Final solution · cups" data-zh="最後溶液 · 杯"></span><output id="volumeValue"></output><input id="volume" type="range" min="1" max="8" step="1"></label><div class="hint-area"><button id="retry" data-en="Reset this mixture" data-zh="重設此溶液"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The spring keeper’s request" data-zh="彩泉守護者的要求"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Colour is a visual guide only. Compare the numbers too." data-zh="顏色只是視覺提示，也要比較數字。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Test the seal ✦" data-zh="測試封印 ✦"></button><button id="next" class="primary" hidden data-en="Next spring →" data-zh="下一道彩泉 →"></button><section id="reward" hidden><h2  data-en="◍ The Tint Sigil" data-zh="◍ 彩泉符印"></h2><p  data-en="Three springs restored. The hidden coffer opens!" data-zh="三道彩泉修復了，隱藏寶盒開啟！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new springs" data-zh="探索新彩泉"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Concentration" data-zh="守護者筆記 · 濃度"></summary><p  data-en="Concentration compares dissolved material with final solution volume. Adding water without losing solute lowers concentration. This ideal model assumes complete dissolution, uniform mixing and no reaction. Colour units and cups are fictional units; colour shading is illustrative, not a measured optical law. The sliders prepare new mixtures; decreasing volume is not pouring out a real solution. In the dilution trial, colour amount stays fixed and volume cannot fall below its starting value. No real chemicals are needed." data-zh="濃度比較已溶物質量與最後溶液體積。加水而不流失溶質，濃度會降低。理想模型假設全部溶解、均勻混合、不發生反應。色素份數和杯是虛構單位；色深只是示意，不是實測光學定律。滑桿用來準備新溶液；減少體積不代表倒出真實溶液。稀釋關卡固定色素量，體積不能低於起始值。不需要真實化學品。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261028"></script><script src="../../shared/progress.js?v=20261029-echo"></script><script src="../../shared/discovery.js?v=20261029-echo"></script><script src="game.js?v=20261028"></script></body></html>
