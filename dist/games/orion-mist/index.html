<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mist Keeper</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../shared/play-layout.css?v=20260925-top-art"><link rel="stylesheet" href="style.css?v=20260926-mist"></head><body class="play-layout"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<section class="mission-intro"><h1 data-en="The Mist Keeper" data-zh="霧海守望者"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The lost city’s harbor is hidden in sea mist. Three boats carry fragments of a bronze map. The keeper knows their caves, but answers only higher, lower or found. Every clue clears part of the shore." data-zh="海霧藏起了古城港口。三艘船載著青銅地圖碎片。守望者知道它們的洞穴，卻只回答更大、更小或找到了。每個線索都能讓部分海岸變得清晰。"></p></details></section>
<div class="harbor" id="scene" role="img" data-en="Moonlit sea caves and a lantern-lit wooden boat" data-zh="月光下的海蝕洞與亮著燈籠的木船" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<section class="mission-progress" data-en="Mission progress" data-zh="任務進度" data-i18n-attr="aria-label"><strong id="progressCount"></strong><progress id="progressBar" max="3" value="0" data-en="Boats found" data-zh="已找到的船" data-i18n-attr="aria-label"></progress><span id="stageLabel"></span></section>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p id="mission"></p><div class="map-key"><span data-en="Lit: still possible" data-zh="亮起：仍有可能"></span><span data-en="Dim: ruled out" data-zh="暗淡：已排除"></span></div><div id="caves" class="caves" role="group" data-en="Numbered caves in increasing order" data-zh="由小至大排列的洞穴" data-i18n-attr="aria-label"></div><p class="small" data-en="Tap a cave to ask the keeper. Read rows from left to right, then down. Keyboard: Tab and Enter." data-zh="點洞穴詢問守望者。每行由左至右，再讀下一行。鍵盤：Tab 和 Enter。"></p><button id="retry" class="quiet" data-en="Try this shore again" data-zh="重新探索這片海岸"></button></section>
<section class="result-panel"><h2 class="panel-label" data-en="Clues & discoveries" data-zh="線索與發現"></h2><p id="feedback" role="status" aria-live="polite"></p><div class="range-card"><strong id="range"></strong><span id="remaining"></span><span id="attempts"></span></div><button id="next" class="primary" hidden data-en="Sail to the next shore →" data-zh="航向下一片海岸 →"></button>
<div class="hint-area"><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div>
<section id="reward" hidden><div class="reward-symbol" aria-hidden="true">≋</div><h2 data-en="The Mist Sigil" data-zh="迷霧符印"></h2><p data-en="Three boats, one map. The keeper lifts the mist and reveals a new passage." data-zh="三艘船拼成一張地圖。守望者撥開霧氣，揭示新的航道。"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new shores" data-zh="探索新的海岸"></button></section>
<details><summary data-en="My search trail" data-zh="我的搜尋紀錄"></summary><ol id="log"></ol></details><details id="notes" hidden><summary data-en="Keeper’s notes · binary search" data-zh="守望者筆記 · 二分搜尋"></summary><p data-en="The cave numbers are ordered and the keeper always tells the truth. A higher clue rules out your number and every smaller number; lower does the reverse. Trying a middle number repeatedly keeps the remaining part small. This strategy is called binary search." data-zh="洞穴號碼有序排列，守望者總是說真話。「更大」能排除你選的號碼及所有較小號碼；「更小」則相反。每次試中間的號碼，能迅速縮小剩餘範圍。這個方法叫二分搜尋。"></p><p id="efficiency"></p><p data-en="This model has exactly one boat per shore and no missing cave numbers. The artwork is atmospheric; the numbered chart is the search model. In real computing, binary search requires ordered data and reliable comparisons. The clearing mist is story magic." data-zh="這個模型的每片海岸剛好有一艘船，洞穴號碼沒有缺漏。圖片營造故事氣氛；編號圖才是搜尋模型。真實程式中的二分搜尋需要有序資料和可靠比較。消散的霧氣是故事魔法。"></p><a href="https://xlinux.nist.gov/dads/HTML/binarySearch.html" target="_blank" rel="noopener" data-en="Source: NIST · Binary search" data-zh="資料：NIST · 二分搜尋"></a></details></section></div>
</main><script src="../../shared/i18n.js?v=20260926-mist"></script><script src="../../shared/progress.js?v=20260926-mist"></script><script src="game.js?v=20260926-mist"></script></body></html>
