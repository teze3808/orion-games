<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap row numbers. Can every space in a rectangle be filled, with both sides longer than one?" data-zh="點選行數。能否填滿長方形的每一格，而且兩邊都多於一？"></p><div id="diagram"></div><p id="rowLabel"></p><div id="rowChoices"></div><div class="hint-area"><button id="retry" data-en="Clear experiments" data-zh="清除實驗"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Choose a shelf" data-zh="選擇書架"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Solid gems are counted. Dashed spaces are empty, not extra gems." data-zh="只計算實心寶石。虛線格是空位，不是額外寶石。"></p><p id="feedback" role="status"></p><div id="classify"><button id="prime" data-en="Prime · only 1 and itself" data-zh="質數 · 只有 1 和本身"></button><button id="composite" data-en="Composite · a filled rectangle" data-zh="合成數 · 能填滿長方形"></button><button id="neither" data-en="Neither · the special 1" data-zh="兩者都不是 · 特別的 1"></button></div><button id="next" class="primary" hidden data-en="Next tray →" data-zh="下一盤 →"></button><section id="reward" hidden><h2  data-en="✶ The Primeheart Sigil" data-zh="✶ 質心符印"></h2><p  data-en="Three trays find their shelves. The archive reveals its treasure!" data-zh="三盤寶石歸位，檔案館的寶藏出現了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new trays" data-zh="探索新寶石盤"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Factors" data-zh="守護者筆記 · 因數"></summary><p data-en="Positive whole-number factors divide a number without leftovers. A prime has exactly two: 1 and itself. A composite number is greater than 1 and has more than two. The number 1 is neither. For our small trays, testing every row count from 2 to one less than the number is enough; faster methods exist. Gem shapes and sizes do not affect these whole-number counts." data-zh="正整數因數能把一個數整除，沒有餘數。質數剛好有兩個：1 和本身。合成數大於 1，而且有多於兩個因數。1 兩者都不是。對這些小數目，測試由 2 到比總數少 1 的每個行數已足夠；也有更快的方法。寶石形狀和大小不影響整數計算。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261108"></script><script src="../../shared/progress.js?v=20261109-inheritance"></script><script src="../../shared/discovery.js?v=20261109-inheritance"></script><script src="game.js?v=20261108"></script></body></html>
