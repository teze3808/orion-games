<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Harbour Bell Tower</title>
<link rel="icon" href="../../shared/favicon.svg?v=20261011-key"><link rel="stylesheet" href="style.css?v=20261111"><link rel="stylesheet" href="../../shared/discovery.css?v=20261020"></head>
<body data-mission="bells"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Harbour Bell Tower" data-zh="海港雙鐘樓"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The moon ferry has brought a locked sea chest ashore. Inside its lid, Orion finds three pairs of clockwork bells. Each lock opens when its bells first chime together again." data-zh="月光渡輪運來一個上鎖的海上寶箱。Orion 在箱蓋內發現三對機械鐘。每對鐘首次再次同時敲響，就能打開一道鎖。"></p></details></div>
<div class="scene"><img src="harbour.jpg" alt="" width="2048" height="683"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p data-en="Both bells rang at minute 0. Move time to the first minute they ring together again." data-zh="兩個鐘在第 0 分鐘同時響起。移動時間，找出它們第一次再次同時響起的是第幾分鐘。"></p>
<div class="clocks" id="clocks"></div><div class="console"><label for="minute" id="minuteLabel"></label><input id="minute" type="range" min="0" max="60" value="0"><div class="buttons"><button id="back" data-en="−1 minute" data-zh="−1 分鐘"></button><button id="forward" data-en="+1 minute" data-zh="+1 分鐘"></button></div></div></section>
<section class="result-panel"><h2 data-en="Bell keeper’s log" data-zh="守鐘人的紀錄"></h2><div id="log"></div><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Try the lock" data-zh="試開箱鎖"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next lock →" data-zh="下一道鎖 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div>
<div id="reward" hidden><h3 data-en="♬ The Unison Sigil" data-zh="♬ 齊鳴符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Try new bells" data-zh="試玩新鐘組"></button></div></section></div></main>
