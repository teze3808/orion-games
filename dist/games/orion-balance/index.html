<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language" aria-label="Language / 語言"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<section class="mission-intro"><h1 data-en="The Gem Balance" data-zh="寶石天平室"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="A gemstone keeper has hidden three numbers in an ancient balance. Try a value for each mystery gem. Make both sides equal to open the treasure room." data-zh="寶石守護者把三個數字藏在古老天平裡。試出神秘寶石的數值，讓兩邊相等，打開寶藏室。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="A brass balance in a moonlit gemstone treasury" data-zh="月光寶石庫中的黃銅天平" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<section class="mission-progress" data-en="Mission progress" data-zh="任務進度" data-i18n-attr="aria-label"><strong id="progressCount"></strong><progress id="progressBar" max="3" value="0" data-en="Seals opened" data-zh="已打開的封印" data-i18n-attr="aria-label"></progress></section>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p id="mission"></p><div id="diagram" role="img"></div><label for="guess" id="guessLabel"></label><div class="guess-controls"><button id="minus" aria-label="Decrease / 減少">−</button><input id="guess" type="range" min="0" max="9" step="1" value="0"><button id="plus" aria-label="Increase / 增加">+</button></div><p class="legend" data-en="Slide or tap + / − to test a value for ONE gem. Watch the two totals." data-zh="拖動滑桿或點按 + / −，試出一顆寶石的數值。觀察兩邊總數。"></p><button id="retry" data-en="Try again from zero" data-zh="由零再試"></button><div class="hint-area"><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div class="screens"><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div></div><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Unlock this seal ⚖" data-zh="打開封印 ⚖"></button><h3 data-en="Your number discoveries" data-zh="你的數字發現"></h3><ol id="log"></ol><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button><section id="reward" hidden><h2 data-en="⚖ The Balance Sigil" data-zh="⚖ 平衡符印"></h2><p data-en="Both sides agree! The gemstone treasury opens for you." data-zh="兩邊相等了！寶石庫為你打開。"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new gem puzzles" data-zh="探索新的寶石謎題"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · equality" data-zh="守護者筆記 · 相等"></summary><p data-en="The = sign means both sides have the same value. This virtual equal-arm balance tests your guessed number; it does not change a real gem’s mass. All blocks are one unit. Gems in the same puzzle are equal. A new puzzle may use a different gem. We ignore the weight of the pans and friction." data-zh="等號 = 表示兩邊數值相同。這個虛擬等臂天平測試你猜的數字，不是改變真實寶石的質量。每塊方塊是一個單位。同一題的寶石數值相同，新題可以不同。模型忽略秤盤重量和摩擦。"></p><a href="https://nrich.maths.org/interactive-environments/interactive-balance" target="_blank" rel="noopener" data-en="Source: NRICH · Interactive Balance" data-zh="資料：NRICH · 互動天平"></a></details></section></div></main><script src="../../shared/i18n.js?v=20261002"></script><script src="../../shared/progress.js?v=20261006-signal"></script><script src="../../shared/discovery.js?v=20261003-shadows"></script><script src="game.js?v=20261002"></script></body></html>
