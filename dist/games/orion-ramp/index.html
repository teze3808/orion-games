<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Drag the slider to change the ramp length. Test it, compare the force, and find the shortest ramp that fits." data-zh="拖動滑桿改變斜坡長度。測試、比較拉力，找出符合要求的最短斜坡。"></p><div id="diagram"></div><label class="axis" for="length"><span  data-en="Sloping length · metres" data-zh="斜面長度 · 米"></span><output id="lengthValue"></output><input id="length" type="range" min="2" max="10" step="1"></label><div class="hint-area"><button id="retry" data-en="Reset this ramp" data-zh="重設此斜坡"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The keeper’s design brief" data-zh="守護者的設計要求"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Ideal model: no friction, steady motion, pull parallel to the ramp. Real ramps need extra force." data-zh="理想模型：沒有摩擦、等速移動、沿斜面拉動。真實斜坡需要額外的力。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Test ramp ✦" data-zh="測試斜坡 ✦"></button><button id="next" class="primary" hidden data-en="Next delivery →" data-zh="下一次運送 →"></button><section id="reward" hidden><h2  data-en="◿ The Ascent Sigil" data-zh="◿ 登高符印"></h2><p  data-en="Three deliveries complete. The mountain treasury opens!" data-zh="三次運送完成，山中寶庫開啟！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new designs" data-zh="探索新設計"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Inclined planes" data-zh="守護者筆記 · 斜面"></summary><p data-en="An inclined plane trades force for distance. Without friction, a steady pull along the ramp satisfies force × sloping length = weight × height. Longer ramps reduce force, not ideal work. Our height is 1 metre and weight 120 newtons; newtons are force, not mass. Real friction and starting motion are omitted. This is a virtual model, not advice for moving heavy objects." data-zh="斜面以路程換取較小的力。沒有摩擦、沿斜面等速拉動時，拉力 × 斜面長度 = 重量 × 高度。較長斜坡減少拉力，不會減少理想功。模型高度為 1 米，重量為 120 牛頓；牛頓是力的單位，不是質量。模型省略真實摩擦和起步加速。這是虛擬模型，不是搬運重物的指引。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261031"></script><script src="../../shared/progress.js?v=20261031-ramp"></script><script src="../../shared/discovery.js?v=20261031-ramp"></script><script src="game.js?v=20261031"></script></body></html>
