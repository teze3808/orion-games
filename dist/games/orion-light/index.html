h="探索新的光色封印"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · light" data-zh="守護者筆記 · 光"></summary><p data-en="This is additive mixing of red, green and blue light on a white screen in a dark room. The lamps have fixed, balanced strengths: red + green makes yellow, red + blue makes magenta, green + blue makes cyan, and all three make white. Paint mixes differently! Real results depend on lamps, brightness, surfaces and your display. This model skips shadows, spectra and variable brightness. The name and treasure are story magic; no real lamps or lasers are needed." data-zh="這是暗室中，在白色屏幕上把紅、綠、藍光相加。光燈強度固定並互相配合：紅加綠成黃，紅加藍成洋紅，綠加藍成青，三種一起成白光。顏料的混合方式不同！真實結果取決於光燈、亮度、表面和你的顯示器。模型省略影子、光譜和亮度調整。名稱和寶藏屬於故事魔法；不需要真正的光燈或雷射。"></p><a href="https://annex.exploratorium.edu/wsw/projects/color_mixing_lab/" target="_blank" rel="noopener" data-en="Source: Exploratorium · Color Mixing" data-zh="資料：Exploratorium · 混色"></a></details></section></div></main><script src="../../shared/i18n.js?v=20261001"></script><script src="../../shared/progress.js?v=20261002-balance"></script><script src="../../shared/discovery.js?v=20261002-balance"></script><script src="game.js?v=20261001"></script></body></html>
