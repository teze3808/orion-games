<section class="mission-intro"><h1 data-en="The Living Tapestry" data-zh="生命織錦寶庫"></h1><details class="story-disclosure"><summary  data-en="Read the story" data-zh="閱讀故事"></summary><p  data-en="Three faded tapestries hide an emerald casket. Follow food energy through meadow, woodland and ocean to weave their living connections again." data-zh="三幅褪色織錦藏着翡翠寶盒。追蹤草地、森林和海洋的食物能量，重新織出生命之間的連繫。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="A sunlit botanical archive with three habitat tapestries" data-zh="陽光照耀的植物檔案館與三幅棲地織錦" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p id="instruction" class="instruction" data-en="Tap three picture cards in order, from food to the animal that eats it. Tap a placed card to remove it." data-zh="依次點選三張圖卡，由食物排到吃它的動物。點已放好的圖卡可移除。"></p><div id="chain" class="chain" aria-live="polite"></div><p class="legend" id="arrowLabel"></p><div id="cards" class="cards"></div><div class="hint-area"><button id="retry" data-en="Clear this chain" data-zh="清空這條食物鏈"></button><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Weave this chain ✦" data-zh="織合這條食物鏈 ✦"></button><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button><section id="reward" hidden><h2 data-en="❋ The Connection Sigil" data-zh="❋ 連繫符印"></h2><p data-en="The tapestries glow. The emerald casket opens!" data-zh="織錦亮起來，翡翠寶盒打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new tapestries" data-zh="探索新的織錦"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · food chains" data-zh="守護者筆記 · 食物鏈"></summary><p  data-en="Arrows go from food to its consumer: they show energy transfer, not the direction an animal moves. Green plants and phytoplankton use light to make food through photosynthesis. These three short chains show selected feeding links, not complete diets or food webs. Real habitats include many connections, decomposers, seasonal changes and other energy sources. The model does not calculate populations or energy amounts. Icons are symbols, not scale drawings." data-zh="箭頭由食物指向吃它的生物，表示能量傳遞，不是動物移動的方向。綠色植物和浮游植物利用光進行光合作用製造養分。這三條短食物鏈只顯示部分攝食關係，不是完整食譜或食物網。真實棲地有很多連繫、分解者、季節變化及其他能量來源。模型不計算族群數量或能量大小。圖示是符號，不是按比例繪畫。"></p><a href="https://www.epa.gov/sites/production/files/documents/foodchainsandfoodwebs.pdf" target="_blank" rel="noopener">EPA · Food chains and food webs</a></details></section></div></main><script src="../../shared/i18n.js?v=20261007"></script><script src="../../shared/progress.js?v=20261010-pollination"></script><script src="../../shared/discovery.js?v=20261010-pollination"></script><script src="game.js?v=20261007"></script></body></html>
