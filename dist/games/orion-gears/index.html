<section class="mission-intro"><h1 data-en="The Gearkeeper’s Vault" data-zh="齒輪守護者的密庫"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three turning seals guard a lighthouse treasury. Swap the gold output gear and try a middle gear to restore the keeper’s machine. Match each seal’s direction and speed to earn the Motion Sigil." data-zh="三道轉動封印守護燈塔寶庫。更換金色輸出齒輪，試試中間齒輪，修復守護者的機器。配對每道封印的方向和速度，獲得傳動符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="An ancient brass gear workshop beside a moonlit sea" data-zh="月光海岸旁的古老黃銅齒輪工坊" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Match the gold wheel’s direction AND speed to the required output." data-zh="讓金色輪的方向和速度都符合所需輸出。"></p><div id="diagram" role="img"></div><fieldset class="gear-controls"><legend data-en="Choose the gold output wheel" data-zh="選擇金色輸出輪"></legend><div class="directions"><button id="small" data-en="⚙ 6 teeth" data-zh="⚙ 6 齒"></button><button id="equal" data-en="⚙ 12 teeth" data-zh="⚙ 12 齒"></button><button id="large" data-en="⚙ 24 teeth" data-zh="⚙ 24 齒"></button></div></fieldset><div class="actions"><button id="idler"></button><button id="pause"></button></div><p class="legend" data-en="Blue = driver · gold = output. Speeds compare full turns, not moving teeth. Diagram is an ideal gear model." data-zh="藍色是主動輪，金色是輸出輪。速度比較的是完整轉動次數，不是移動的齒。圖示是理想齒輪模型。"></p><div class="hint-area"><button id="retry" data-en="Restore this design" data-zh="還原這次設計"></button><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div class="screens"><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div></div><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Unlock gear seal ✦" data-zh="打開齒輪封印 ✦"></button><h3 data-en="Your tested designs" data-zh="你測試的設計"></h3><ol id="log"></ol><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button><section id="reward" hidden><h2 data-en="✥ The Motion Sigil" data-zh="✥ 傳動符印"></h2><p data-en="The three gears align. The sunstone door reveals its treasure!" data-zh="機器修復了！燈塔密庫展現寶藏！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new gear seals" data-zh="探索新的齒輪封印"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · gears" data-zh="守護者筆記 · 齒輪"></summary><p data-en="External gears that mesh turn opposite ways. Output speed equals driver speed × driver teeth ÷ output teeth. A simple middle gear changes direction, not the final speed ratio. This ideal model assumes matching tooth spacing, rigid gears and no slipping. Shafts reposition automatically; real machines need careful alignment. Tooth shapes are simplified, and friction, load, torque and motor power are not simulated. Artwork is decorative, not a construction guide." data-zh="互相嚙合的外齒輪轉向相反。輸出速度等於主動速度 × 主動輪齒數 ÷ 輸出輪齒數。單個中間齒輪會改變方向，不改變最後的速度比例。理想模型假設齒距相同、齒輪剛硬而且不打滑。輪軸會自動調位；真實機器需要仔細對準。齒形經過簡化，沒有模擬摩擦、負載、扭力或馬達功率。背景插圖是裝飾，不是製作指南。"></p><a href="https://le-www-live-s.legocdn.com/downloads/MachinesAndMechanisms/MachinesAndMechanisms_Activity-Pack-For-Simple-Machines_1.0_en-GB.pdf" target="_blank" rel="noopener" data-en="Source: LEGO Education · Simple machines" data-zh="資料：LEGO Education · 簡單機械"></a></details></section></div></main><script src="../../shared/i18n.js?v=20261005"></script><script src="../../shared/progress.js?v=20261005-gears"></script><script src="../../shared/discovery.js?v=20261005-gears"></script><script src="game.js?v=20261005"></script></body></html>
