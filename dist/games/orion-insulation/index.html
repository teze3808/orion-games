<section class="mission-intro"><h1 data-en="The Winter Lantern" data-zh="寒冬之燈"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="A warm crystal must cross the snowy city. Compare jackets for two identical lanterns and discover how to slow their cooling." data-zh="溫暖晶石要穿過雪中古城。比較兩盞相同晶燈的外套，發現如何減慢冷卻。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Choose jackets and layers. Run both lanterns together, then use the readings to choose which stayed warmer." data-zh="選擇外套和層數，同時測試兩盞燈，再根據讀數選出較暖的一盞。"></p><div id="lanterns" role="img"></div><div class="controls"><fieldset><legend>A</legend><label for="aMaterial" data-en="Jacket" data-zh="外套"></label><select id="aMaterial"><option value="0" data-en="No jacket" data-zh="沒有外套"></option><option value="1" data-en="Woven wrap" data-zh="編織外套"></option><option value="2" data-en="Air-pocket wrap" data-zh="氣袋外套"></option></select><label for="aLayers" data-en="Layers" data-zh="層數"></label><input id="aLayers" type="range" min="1" max="3" value="1"><output id="aCount"></output></fieldset><fieldset><legend>B</legend><label for="bMaterial" data-en="Jacket" data-zh="外套"></label><select id="bMaterial"><option value="0" data-en="No jacket" data-zh="沒有外套"></option><option value="1" data-en="Woven wrap" data-zh="編織外套"></option><option value="2" data-en="Air-pocket wrap" data-zh="氣袋外套"></option></select><label for="bLayers" data-en="Layers" data-zh="層數"></label><input id="bLayers" type="range" min="1" max="3" value="1"><output id="bCount"></output></fieldset></div><div class="actions"><button id="run" class="primary" data-en="Run fair test ▶" data-zh="開始公平測試 ▶"></button><button id="stop" hidden data-en="Stop" data-zh="停止"></button></div><p id="conditions" class="legend"></p><div class="hint-area"><button id="retry" data-en="Try this comparison again" data-zh="重試這次比較"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><p id="goal" class="goal"></p><div id="chart" role="img"></div><p id="reading" role="status"></p><p class="legend" data-en="Illustrative model · Both start together. No heater is on. Change a jacket to clear its test." data-zh="示意模型 · 同時開始，沒有加熱器。改變外套會清除測試。"></p><p data-en="Which stayed warmer?" data-zh="哪一盞保持較暖？"></p><div class="choices"><button id="chooseA">A</button><button id="chooseEqual" data-en="Equal" data-zh="相同"></button><button id="chooseB">B</button></div><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check my evidence ✦" data-zh="檢查我的證據 ✦"></button><button id="next" class="primary" hidden data-en="Next snowy passage →" data-zh="下一段雪路 →"></button>

<details id="notes" hidden><summary data-en="Keeper’s notes · Insulation" data-zh="守護者筆記 · 隔熱"></summary><p data-en="Heat flows from warmer to cooler surroundings. Insulation slows that transfer; it supplies no heat. This simplified exponential cooling model keeps the surroundings, container, contents and starting temperature identical. Jacket resistance increases with layers; coefficients and simulated minutes are illustrative, not measured material data. Real cooling also depends on moisture, gaps, airflow, radiation and geometry. Our crystal light is story magic, not a heater. No real hot-water experiment is needed." data-zh="熱由較暖處傳向較冷環境。隔熱減慢傳熱，不提供熱。本簡化指數冷卻模型保持環境、容器、內容物和起始溫度相同。層數增加會提高外套熱阻；係數和模擬分鐘只是示意，不是實測材料數據。真實冷卻也受水分、空隙、氣流、輻射和形狀影響。晶石光芒是故事魔法，不是加熱器。不需要進行真實熱水實驗。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261018"></script><script src="../../shared/progress.js?v=20261021-atoms"></script><script src="../../shared/discovery.js?v=20261021-atoms"></script><script src="game.js?v=20261018"></script></body></html>
