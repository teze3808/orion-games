<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Sandstone Vault</title>

<body data-mission="pressure"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Sandstone Vault" data-zh="砂岩密庫"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three pressure seals guard a desert chest. Change the footprint beneath each stone until its pressure matches the seal." data-zh="沙漠寶箱由三道壓強封印守護。改變石塊下方底座的接觸面積，讓壓強與封印吻合。"></p></details></div>
<div class="scene"><img src="vault.jpg" alt="" width="1440" height="480"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p id="instruction"></p><p id="load"></p><div class="model"><div class="stone">▼</div><div id="base"></div><div class="sand"></div></div><label for="area" data-en="Contact area · m²" data-zh="接觸面積 · 平方米"></label><output id="areaValue" for="area"></output><input id="area" type="range" min="1" max="8" step="1" value="1"></section><section class="result-panel"><h2 data-en="Pressure seal" data-zh="壓強封印"></h2><p id="goal"></p><output id="reading"></output><p data-en="Pa means newtons per square metre. The force stays fixed while you change the base." data-zh="Pa（帕斯卡）表示每平方米承受多少牛頓。改變底座時，向下的力保持不變。"></p><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Test the seal" data-zh="測試封印"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next stone →" data-zh="下一塊石頭 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div>
<div id="reward" hidden><h3 data-en="▰ The Footing Sigil" data-zh="▰ 穩基符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Try new stones" data-zh="試試新石塊"></button></div></section></div></main>
