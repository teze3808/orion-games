<section class="mission-intro"><h1 data-en="The Heart of the Labyrinth" data-zh="智慧之心的地下迷城"></h1><details class="story-disclosure"><summary  data-en="Read the story" data-zh="閱讀故事"></summary><p  data-en="A glowing heart waits beyond three passage maps. Every passage costs energy. Trace the least-energy route from S to T to awaken each seal and claim the Wisdom Sigil." data-zh="發光的智慧之心藏在三張通道地圖之後。每條通道都消耗能量。畫出由 S 到 T 最省能量的路線，喚醒封印，獲得智慧符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="An ancient underground vault with a glowing amber heart" data-zh="古老地下寶庫與發光的琥珀之心" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Start at S. Tap a connected room to extend your route to T. Add the passage numbers: find the smallest total." data-zh="從 S 出發，點相連的房間，延伸路線至 T。把通道數字相加，找出最小總數。"></p><div id="map" class="map"><svg id="paths" viewBox="0 0 500 280" preserveAspectRatio="none" role="img"></svg><div id="nodes"></div></div><p class="legend" data-en="S = start · T = treasure. Numbers mean energy, not drawn distance. All passages work both ways." data-zh="S 是起點，T 是寶藏。數字表示能量，不是圖上的距離。所有通道可雙向通行。"></p><button id="undo" data-en="Undo last room" data-zh="退回上一個房間"></button><div class="hint-area"><button id="retry" data-en="Clear this route" data-zh="清空這條路線"></button><button id="hint" class="rune" aria-controls="hints" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><div id="goal" class="goal"></div><div id="reading" class="goal" role="status"></div><ol id="log"></ol><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Check my route ✦" data-zh="檢查路線 ✦"></button><button id="next" class="primary" hidden data-en="Open the next seal →" data-zh="打開下一道封印 →"></button><section id="reward" hidden><h2 data-en="◎ The Wisdom Sigil" data-zh="◎ 智慧符印"></h2><p data-en="Three paths awaken the amber heart. The Wisdom Sigil is yours!" data-zh="三條路線喚醒琥珀之心。你獲得智慧符印了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new passage maps" data-zh="探索新的通道地圖"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · shortest paths" data-zh="守護者筆記 · 最短路徑"></summary><p  data-en="Rooms are vertices and passages are edges of a weighted graph. Here shortest means the smallest sum of energy costs, not the fewest passages or the shortest line on screen. Every cost is positive, so a loop only adds cost; routes do not revisit rooms. Any tied minimum route is accepted. This is a small undirected model with fixed fictional energy units, not a real navigation or battery simulation." data-zh="房間是加權圖的頂點，通道是邊。這裡的「最短」是能量總和最小，不是通道最少，也不是畫面上的線最短。每段成本都是正數，所以繞圈只會增加成本；路線不重訪房間。若有多條同樣省能量的路線，任何一條都可通過。這是使用固定虛構能量單位的小型無向圖，不是真實導航或電池模擬。"></p><a href="https://openstax.org/books/introduction-computer-science/pages/3-5-sample-algorithms-by-problem" target="_blank" rel="noopener">OpenStax · Shortest paths</a></details></section></div></main><script src="../../shared/i18n.js?v=20261008"></script><script src="../../shared/progress.js?v=20261009-buoyancy"></script><script src="../../shared/discovery.js?v=20261009-buoyancy"></script><script src="game.js?v=20261008"></script></body></html>
