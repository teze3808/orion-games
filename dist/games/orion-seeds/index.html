<section class="mission-intro"><p class="eyebrow" data-en="ORION’S EXPEDITION · THE LOST CONSERVATORY" data-zh="ORION 的探險 · 失落溫室"></p><h1 data-en="The Sleeping Seed Vault" data-zh="沉睡種子寶庫"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Behind a curtain of vines, a bronze cabinet holds the lost city’s seeds. Its keeper left two growing chambers and three unfinished experiments. Compare their stories to earn the Verdant Sigil." data-zh="藤蔓後方，青銅寶櫃收藏著古城的種子。守護者留下兩間培育箱和三個未完成的實驗。比較它們的變化，尋找青翠符印。"></p></details></section>
<div class="vault-art" id="vaultArt" role="img" data-en="An ancient seed cabinet in a sunlit conservatory" data-zh="陽光照耀溫室內的古老種子寶櫃" data-i18n-attr="aria-label"><span id="sceneStatus"></span></div>
<section class="mission-progress" data-en="Mission progress" data-zh="任務進度" data-i18n-attr="aria-label"><strong id="progressCount"></strong><progress id="progressBar" max="3" value="0" data-en="Seals completed" data-zh="已解開封印" data-i18n-attr="aria-label"></progress><p class="eyebrow" id="stageLabel"></p></section>
<div class="play-grid"><section class="experiment-panel"><h2 class="panel-label" data-en="Experiment" data-zh="動手探索"></h2><h2 id="stageTitle"></h2><p id="mission"></p><p class="same-conditions" data-en="Same bean type, starting age, soil, warmth and trial length. A is fixed; you adjust B." data-zh="相同豆類、起始生長階段、土壤、溫度和試驗時間。A 已固定；由你調整 B。"></p>
<div class="chambers"><article class="chamber"><h3 data-en="A · Keeper’s chamber" data-zh="A · 守護者培育箱"></h3><div class="plant-picture seed" id="startA" role="img"></div><p id="settingsA"></p><span class="fixed-label" data-en="Fixed comparison" data-zh="固定作比較"></span></article><article class="chamber adjustable"><h3 data-en="B · Your chamber" data-zh="B · 你的培育箱"></h3><div class="plant-picture seed" id="startB" role="img"></div><p id="settingsB"></p><span class="fixed-label" data-en="Adjust below ↓" data-zh="在下方調整 ↓"></span></article></div>
<div id="controls"><section class="setting"><div class="setting-heading"><label for="water" data-en="💧 Soil moisture in B" data-zh="💧 B 的土壤濕度"></label><output id="waterValue" for="water"></output></div><div class="slider-row"><button id="lessWater" type="button" data-en="Reduce moisture" data-zh="減少水分" data-i18n-attr="aria-label">−</button><input id="water" type="range" min="0" max="2" step="1" value="0"><button id="moreWater" type="button" data-en="Increase moisture" data-zh="增加水分" data-i18n-attr="aria-label">+</button></div><div class="range-labels"><span data-en="Dry" data-zh="乾燥"></span><span data-en="Moist" data-zh="濕潤"></span><span data-en="Flooded" data-zh="積水"></span></div><p id="waterLock" class="small"></p></section>
<section class="setting light-setting"><button id="light" type="button" aria-pressed="false"></button><p id="lightLock" class="small"></p></section>
<fieldset><legend id="predictionQuestion"></legend><div class="prediction-buttons"><button id="predictA" data-choice="A" type="button" aria-pressed="false">A</button><button id="predictB" data-choice="B" type="button" aria-pressed="false">B</button><button id="predictSame" data-choice="same" type="button" aria-pressed="false" data-en="Same" data-zh="相同"></button></div></fieldset>
<button id="run" class="primary" type="button" data-en="⌛ Run a growing trial" data-zh="⌛ 開始生長試驗"></button><p class="small" data-en="Virtual time passes instantly. Each trial starts with a fresh matching pair." data-zh="虛擬時間會瞬間流逝。每次試驗都從一對狀態相同的新樣本開始。"></p></div>

<section id="reward" hidden><div class="reward-symbol" aria-hidden="true">❧</div><h2 data-en="The Verdant Sigil" data-zh="青翠符印"></h2><p data-en="Three comparisons awaken the seed cabinet. You discovered that a seed’s beginning and a seedling’s growth are different stories." data-zh="三次比較喚醒了種子寶櫃。你發現種子開始發芽，與幼苗繼續生長，是不同的故事。"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden type="button" data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" type="button" data-en="Explore the chambers again" data-zh="再次探索培育箱"></button></section>
<details><summary data-en="My trial log" data-zh="我的試驗紀錄"></summary><ol id="log"></ol></details>
<details id="notes" hidden><summary data-en="Keeper’s notes · the biology" data-zh="守護者筆記 · 認識生物學"></summary><p data-en="Germination is the beginning of growth from a seed. Seeds need water, oxygen and a suitable temperature. Our bean seeds use stored food to begin growing in light or darkness. Once leaves develop, light supports photosynthesis and healthy green growth. A tall pale seedling is not necessarily a healthy one." data-zh="萌發是種子開始生長的過程。種子需要水、氧氣和合適的溫度。這裡的豆種子利用儲存的養分，在有光或黑暗的環境都能開始生長。葉片長出後，光照支持光合作用和健康的綠色生長。長得高而蒼白的幼苗，不一定健康。"></p><p data-en="A fair comparison changes one factor while keeping the others alike. These ideal trials assume viable matching beans, suitable warmth, ventilated chambers and enough time. Moist soil contains air spaces; prolonged flooding reduces oxygen. The pictures symbolize growth stages, not exact colours, sizes or growth rates. Other species can need light or darkness to germinate. No real experiment is required; the glowing cabinet is story magic." data-zh="公平比較只改變一項因素，其餘條件保持相同。這些理想試驗假設豆種子有活力、狀態相同，溫度合適、培育箱通風，而且時間足夠。濕潤土壤有空氣間隙；長期積水會減少氧氣。圖片象徵生長階段，不表示精確的顏色、大小或生長速度。其他物種可能需要光照或黑暗才會萌發。無須做真實實驗；發光寶櫃是故事魔法。"></p><a href="https://web.extension.illinois.edu/gpe/case3/c3facts3.html" target="_blank" rel="noopener" data-en="Science source · Illinois Extension" data-zh="科學資料 · 伊利諾大學推廣部"></a></details>
</section></div><footer data-en="A virtual biology mystery. Take your time. Sigils are saved in this browser only." data-zh="虛擬生物學解謎。慢慢探索，符印只儲存在目前的瀏覽器。"></footer></main>
