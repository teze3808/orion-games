<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Lantern Clock Chamber</title>
<link rel="icon" href="../../shared/favicon.svg?v=20261011-key"><link rel="stylesheet" href="style.css?v=20261119"><link rel="stylesheet" href="../../shared/discovery.css?v=20261020"></head>
<body data-mission="pendulum"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Lantern Clock Chamber" data-zh="擺燈鐘室"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three lantern clocks have lost their rhythm. Tune the pendulum length, measure a full swing and restore each clock to open the keeper’s chest." data-zh="三座擺燈鐘失去了節奏。調整擺長，量度一次完整來回，修復時鐘，打開守護者的寶箱。"></p></details></div>
<div class="scene"><img src="chamber.jpg" alt="" width="1440" height="720"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p id="instruction"></p><div class="apparatus" aria-hidden="true"><div id="arm"><span class="bob">✦</span></div><i class="pivot"></i></div><label for="length" data-en="Pendulum length (pivot to bob centre)" data-zh="擺長（支點至擺錘中心）"></label><output id="lengthValue" for="length"></output><input id="length" type="range" min="1" max="6" step="1" value="1"><div class="buttons"><button id="measure" data-en="Release & measure" data-zh="放手並量度"></button><button id="stop" hidden data-en="Stop" data-zh="停止"></button></div><p class="key" data-en="One full swing goes to the other side and back to the starting side." data-zh="一次完整來回：擺到另一邊，再回到起點那一邊。"></p></section><section class="result-panel"><h2 data-en="Clock inscription" data-zh="時鐘銘文"></h2><p id="goal" class="goal"></p><p id="reading" role="status"></p><h3 data-en="Your measurements" data-zh="你的量度紀錄"></h3><ol id="log"></ol><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Set this clock" data-zh="設定時鐘"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next clock →" data-zh="下一座鐘 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div>
<div id="reward" hidden><h3 data-en="◷ The Timekeeper Sigil" data-zh="◷ 守時符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Tune new clocks" data-zh="調校新時鐘"></button></div></section></div></main>
