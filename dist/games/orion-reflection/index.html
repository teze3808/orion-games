<section class="mission-intro"><h1 data-en="The Mirror Garden" data-zh="鏡影花園"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The moon mirror has lost three garden patterns. Place blue gems to reflect the gold gems and awaken the Twinlight Sigil." data-zh="月鏡失落了三幅花園圖案。放上藍寶石，映照金寶石，喚醒雙光符印。"></p></details></section>
<div id="scene" class="scene" role="img" data-en="An ancient silver mirror and gemstone mosaics in a moonlit garden" data-zh="月光花園中的古老銀鏡與寶石拼畫" data-i18n-attr="aria-label"><div class="scene-caption"><span id="sceneStatus"></span><span id="seals" aria-hidden="true"></span></div></div>
<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Tap empty tiles across the silver mirror line to place 3 blue gems. Tap a blue gem again to remove it." data-zh="點按銀色鏡線另一邊的空格，放置 3 顆藍寶石。再點一次藍寶石可移除。"></p><div id="board" role="group" data-en="Garden tiles: rows top to bottom, columns left to right" data-zh="花園格子：行由上到下，列由左到右" data-i18n-attr="aria-label"></div><p class="legend" data-en="◆ Gold: original · ◇ Blue: your reflection · ╱ Silver: mirror line" data-zh="◆ 金色：原圖 · ◇ 藍色：你的鏡像 · ╱ 銀色：鏡線"></p><div class="hint-area"><button id="retry" data-en="Clear my blue gems" data-zh="清除我的藍寶石"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section>
<section class="result-panel"><h2 class="panel-label" data-en="Your discoveries" data-zh="你的發現"></h2><p id="goal" class="goal"></p><div id="preview" role="img"></div><p id="count" role="status"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Test the mirror ✦" data-zh="測試月鏡 ✦"></button><button id="next" class="primary" hidden data-en="Restore the next garden →" data-zh="修復下一座花園 →"></button><section id="reward" hidden><h2 data-en="⋈ The Twinlight Sigil" data-zh="⋈ 雙光符印"></h2><p data-en="Three garden patterns shine together. You discovered reflection!" data-zh="三幅花園圖案一起閃耀。你發現了鏡像反射！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new patterns" data-zh="探索新圖案"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · Reflection" data-zh="守護者筆記 · 反射"></summary><p data-en="Each point and its reflection are equally far from the mirror line, on opposite sides. Their joining segment crosses the mirror line at a right angle. Reflection preserves distances and size; reflecting twice returns the original. Our grid models point positions at tile centres, not light rays or curved mirrors. Rows increase downward and columns increase rightward. Silver tiles mark the line; their centres do not move under reflection." data-zh="每點和它的鏡像在鏡線兩邊，距離鏡線相同。連接兩點的線段與鏡線成直角。反射保持距離和大小；反射兩次會回到原圖。本格子以每格中心表示點的位置，不模擬光線或曲面鏡。行數向下增加，列數向右增加。銀格標示鏡線，格子中心反射後不變。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261019"></script><script src="../../shared/progress.js?v=20261026-coordinates"></script><script src="../../shared/discovery.js?v=20261026-coordinates"></script><script src="game.js?v=20261019"></script></body></html>
