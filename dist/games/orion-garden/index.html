<section class="mission-intro"><h1 data-en="The Walled Garden" data-zh="圍牆花園"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Orion finds a chest of moonflower seeds. Three stone beds have lost their corners. Move their walls so every seed has its own square." data-zh="Orion 發現一箱月光花種子。三個石砌花圃的牆角錯位了。移動圍牆，讓每顆種子都有自己的方格。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Drag the width slider. Watch the rows change as the same fence wraps around a new shape." data-zh="拖動滑桿調整闊度，看看同一圈圍牆變成不同形狀時，花圃的行數有甚麼變化。"></p><div id="diagram"></div><label class="axis" for="length"><span  data-en="Garden width" data-zh="花圃闊度"></span><output id="lengthValue"></output><input id="length" type="range" min="1" max="7" step="1"></label><div class="hint-area"><button id="retry" data-en="Reset this bed" data-zh="重設花圃"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Seed chest" data-zh="種子寶箱"></h2><p id="goal" class="goal"></p><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="One seed fits in each square. Use the whole fence, with no spare squares." data-zh="每格種一顆種子。用盡所有圍牆，不留空格。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Plant the seeds ✦" data-zh="播下種子 ✦"></button><button id="next" class="primary" hidden data-en="Next garden →" data-zh="下一個花圃 →"></button><section id="reward" hidden><h2  data-en="❀ The Moonflower Sigil" data-zh="❀ 月華符印"></h2><p  data-en="All three beds bloom. The moonflower chest opens!" data-zh="三個花圃都開花了。月光花寶箱打開了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Try new gardens" data-zh="探索新花圃"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Area and perimeter" data-zh="守護者筆記 · 面積與周界"></summary><p data-en="Count the edges around the outside for perimeter. Count the squares inside for area. For example, a 1 by 5 bed and a 2 by 4 bed both need 12 fence pieces, but they hold 5 and 8 seeds." data-zh="數外圈的單位邊可
