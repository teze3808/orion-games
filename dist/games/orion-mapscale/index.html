<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Mountain Map Room</title>
<link rel="icon" href="../../shared/favicon.svg?v=20261011-key"><link rel="stylesheet" href="style.css?v=20261113"><link rel="stylesheet" href="../../shared/discovery.css?v=20261020"></head>
<body data-mission="mapscale"><main>
<header><a href="../../" data-en="← Mission map" data-zh="← 任務地圖"></a><label>Language / 語言 <select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option></select></label></header>
<div class="title"><h1 data-en="The Mountain Map Room" data-zh="山徑藏圖室"></h1><details><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="Three routes have faded from the mountain atlas. Read each scale and send the right distance to open the pass." data-zh="山區圖集有三條路線的里程褪了色。讀取每幅圖的比例尺，填上正確距離，打開山口。"></p></details></div>
<div class="scene"><img src="atlas.jpg" alt="" width="1440" height="720"><span id="progress"></span></div>
<div class="bench"><section><h2 id="stageTitle"></h2><p id="instruction"></p><div id="trail" class="trail" role="img"></div><div id="scale"></div></section><section class="result-panel"><h2 data-en="Distance seal" data-zh="里程封印"></h2><label for="distance" data-en="Set the route length" data-zh="調整路線長度"></label><output id="reading" for="distance"></output><input id="distance" type="range" min="0" max="30" step="1" value="0"><p id="feedback" role="status"></p><div class="buttons"><button id="check" class="primary" data-en="Stamp distance" data-zh="蓋印確認距離"></button><button id="hint" aria-expanded="false" aria-controls="clues">✧</button><button id="next" hidden data-en="Next chart →" data-zh="下一幅地圖 →"></button></div><div id="clues" hidden><ol id="hints"></ol><button id="close" data-en="Close clues" data-zh="收起提示"></button></div>
<div id="reward" hidden><h3 data-en="⚑ The Trailmark Sigil" data-zh="⚑ 路標符印"></h3><p id="saved" role="status"></p><button id="retrySave" data-en="Save sigil again" data-zh="再次儲存符印"></button><a href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a> <button id="replay" data-en="Explore new charts" data-zh="探索新地圖"></button></div></section></div></main>
<script src="../../shared/i18n.js?v=20261110"></script><script src="../../shared/progress.js?v=20261113-mapscale"></script><script src="../../shared/discovery.js?v=20261113-mapscale"></script><script src="game.js?v=20261113"></script></body></html>
