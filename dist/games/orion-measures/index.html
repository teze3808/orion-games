<section class="mission-intro"><h1 data-en="The Garden of Measures" data-zh="量度花園"></h1><details class="story-disclosure"><summary data-en="Read the story" data-zh="閱讀故事"></summary><p data-en="The moon garden has lost its borders. Shape three planting plots to restore the gardener’s treasure. Green squares are soil; the gold edge is the fence." data-zh="月光花園的邊界消失了。塑造三塊種植地，找回園丁的寶藏。綠色方格是泥土，金色邊線是圍欄。"></p></details></section>

<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="Slide the width and height to reshape your garden. Match the keeper’s request, then test it." data-zh="滑動寬度和高度，改變花圃形狀。符合守護者的要求後，再檢查。"></p><div id="diagram"></div><p class="legend" data-en="Each small square is 1 × 1 unit. Gold marks the outer fence." data-zh="每個小方格是 1 × 1 單位。金色標示外圍的圍欄。"></p><div class="dimensions"><label for="width" data-en="Width ↔" data-zh="寬度 ↔"></label><input id="width" type="range" min="1" max="8" step="1" value="1"><output id="widthValue" for="width"></output><label for="height" data-en="Height ↕" data-zh="高度 ↕"></label><input id="height" type="range" min="1" max="8" step="1" value="1"><output id="heightValue" for="height"></output></div><div class="hint-area"><button id="retry" data-en="Reset this plot" data-zh="重設這塊花圃"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="The keeper’s request" data-zh="守護者的要求"></h2><p id="goal" class="goal"></p><div class="measure"><span data-en="Soil area" data-zh="泥土面積"></span><strong id="area"></strong><small data-en="square units · inside" data-zh="平方單位 · 裏面"></small></div><div class="measure fence"><span data-en="Fence perimeter" data-zh="圍欄周界"></span><strong id="perimeter"></strong><small data-en="units · around the edge" data-zh="單位 · 繞外圍一圈"></small></div><p id="comparison" class="legend"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Test this garden ✦" data-zh="檢查花圃 ✦"></button><button id="next" class="primary" hidden data-en="Next garden →" data-zh="下一塊花圃 →"></button><section id="reward" hidden><h2 data-en="▦ The Measure Sigil" data-zh="▦ 量度符印"></h2><p data-en="Three gardens restored. The keeper’s treasure opens!" data-zh="三塊花圃修復了，園丁的寶藏開啟了！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Shape new gardens" data-zh="塑造新花圃"></button></section><details id="notes" hidden><summary data-en="Keeper’s notes · Area and perimeter" data-zh="守護者筆記 · 面積與周界"></summary><p data-en="Area counts unit squares covering the inside. Perimeter measures the outside boundary. For a rectangle, area = width × height and perimeter = 2 × (width + height). Equal area need not mean equal perimeter, and equal perimeter need not mean equal area. These flat rectangles use whole-number lengths from 1 to 8. Fence thickness, paths and plant spacing are not modelled; the courtyard artwork is decorative." data-zh="面積計算覆蓋內部的單位方格，周界量度外圍邊線。長方形的面積 = 寬 × 高；周界 = 2 ×（寬 + 高）。相同面積不一定有相同周界；相同周界也不一定有相同面積。模型使用邊長 1 至 8 的整數平面長方形，不計圍欄厚度、小路或植物間距；石庭圖片只是裝飾。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261024"></script><script src="../../shared/progress.js?v=20261027-stack"></script><script src="../../shared/discovery.js?v=20261027-stack"></script><script src="game.js?v=20261024"></script></body></html>
