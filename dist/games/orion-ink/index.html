<div class="play-grid"><section class="experiment-panel"><h2 id="stageTitle"></h2><p class="instruction" data-en="These strips show three known dyes after separation. Tap the dyes below to build your mixture." data-zh="這些紙條顯示三種已知染料分離後的色點。輕按下方染料，配出你的混合物。"></p><div id="diagram"></div><div class="switches"><button id="bit0" aria-pressed="false"></button><button id="bit1" aria-pressed="false"></button><button id="bit2" aria-pressed="false"></button></div><div class="hint-area"><button id="retry" data-en="Clear mixture" data-zh="清空混合物"></button><button id="hint" class="rune" aria-expanded="false">✧</button><ol id="hints" hidden></ol></div></section><section class="result-panel"><h2 class="panel-label" data-en="Compare the ink strips" data-zh="比較墨水色譜"></h2><div id="goal" class="goal"></div><div id="reading" role="status"></div><p id="reference"></p><p class="legend" data-en="Virtual model: finished strips, not a real-time experiment. Symbols help you distinguish colours." data-zh="虛擬模型：顯示完成後的紙條，不是實時計時實驗。符號幫助辨認顏色。"></p><p id="feedback" role="status"></p><button id="check" class="primary" data-en="Identify ink ✦" data-zh="辨認墨水 ✦"></button><button id="next" class="primary" hidden data-en="Next ink →" data-zh="下一瓶墨水 →"></button><section id="reward" hidden><h2  data-en="≔ The Spectrum Sigil" data-zh="≔ 色譜符印"></h2><p  data-en="Three inks identified. The archive chest opens!" data-zh="三瓶墨水辨認完成，檔案寶箱開啟！"></p><p id="saveStatus" role="status"></p><button id="retrySave" hidden data-en="Save my sigil again" data-zh="再次儲存符印"></button><a class="button" href="../../" data-en="Return to my sigils" data-zh="返回我的符印"></a><button id="replay" data-en="Explore new inks" data-zh="探索新墨水"></button></section><details id="notes" hidden><summary  data-en="Keeper’s notes · Chromatography" data-zh="守護者筆記 · 色譜法"></summary><p data-en="Paper chromatography separates components of a mixture as solvent moves through paper. Dyes interact differently with the solvent and stationary material, so they may travel different distances. Compare standards under the same conditions. Our three fictional dyes always form distinct spots at 2, 5 and 8 cm, with the solvent front at 10 cm. Real substances can overlap: a matching spot alone does not prove identity. Shapes are accessibility labels, not actual spot shapes. No real chemicals are needed." data-zh="紙色譜法利用溶劑在紙上移動，把混合物成分分離。染料與溶劑及固定材料的相互作用不同，因此可能移動不同距離。必須在相同條件下比較標準樣本。模型三種虛構染料的色點固定在 2、5、8 厘米，溶劑前緣在 10 厘米。真實物質的色點可能重疊，單靠一個相同色點不能證明身分。形狀是無障礙標記，不是真實色點形狀。遊戲不需要使用真實化學品。"></p></details></section></div></main><script src="../../shared/i18n.js?v=20261103"></script><script src="../../shared/progress.js?v=20261108-primes"></script><script src="../../shared/discovery.js?v=20261108-primes"></script><script src="game.js?v=20261103"></script></body></html>
