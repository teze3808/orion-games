<details id="notes" hidden><summary data-en="Keeper’s notes · Moon phases" data-zh="守護者筆記 · 月相"></summary><p data-en="Sunlight lights half the Moon outside eclipses. As it orbits Earth, we see different amounts of that lit half. The Moon does not make its own light. Our fixed Sun direction and eight equal orbit steps simplify the geometry; this is not a calendar or a timing model. Earth-view disks use north-up orientation: waxing is lit on the right, waning on the left. The Moon’s appearance can rotate with your location and viewing time. Real orbital tilt means eclipses do not happen every month; this top-down model omits shadows and eclipses. Sizes, distances and artwork are not to scale." data-zh="日月食以外，陽光照亮月亮的一半。月亮繞地球運行時，我們看見受光一半的不同比例。月亮不會自己發光。固定太陽方向和八個等距軌道停點是幾何簡化，不是曆法或時間模型。地球視角以北方朝上：盈月右亮、虧月左亮；真實外觀會因地點和觀看時間而旋轉。真實軌道傾斜，所以不是每月都有日月食；本俯視模型省略影子和日月食。大小、距離和插畫不按比例。"></p></details>
